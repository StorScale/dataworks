# Who may run how much: Trino's resource groups, from a database the
# platform operator keeps (internal/reconcile/trino.go), read every second.
# A group per project (its members' queries that name it, client tag
# project:<name>, and its own pipelines'), a group per person for the rest,
# one cap for the install. Trino makes the tables as it starts.
resource-groups.configuration-manager=db
resource-groups.config-db-url=jdbc:postgresql://trino-db:5432/trino
resource-groups.config-db-user=trino
resource-groups.config-db-password=${ENV:TRINO_DB_PASSWORD}
