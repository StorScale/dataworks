# Each finished query, posted to platformd (use case 13.1): what it read, its
# CPU time and who ran it, counted against the projects whose tables it read.
# With Trino's shared secret, which platformd checks. A query isn't held up
# if platformd doesn't answer.
event-listener.name=http
http-event-listener.log-completed=true
http-event-listener.connect-ingest-uri=http://platformd:8080/internal/usage/trino
http-event-listener.connect-http-headers=X-Storscale-Usage:${ENV:TRINO_SHARED_SECRET}
http-event-listener.connect-retry-count=2
