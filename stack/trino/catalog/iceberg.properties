# Iceberg tables: the catalog is Nessie (its Iceberg REST API), the data is in
# Buckets. Trino reads and writes the files with its own Buckets service
# account, which is allowed the warehouse bucket and nothing else.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://nessie:19120/iceberg/
iceberg.rest-catalog.warehouse=warehouse
# Nessie answers the platform's catalog account alone (Keycloak's client
# lakehouse-catalog): Trino signs in as it, and Ranger decides what each
# person may do here.
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=lakehouse-catalog:${ENV:CATALOG_CLIENT_SECRET}
iceberg.rest-catalog.oauth2.server-uri=http://keycloak:8080/sso/realms/lakehouse/protocol/openid-connect/token
iceberg.rest-catalog.oauth2.scope=openid

fs.s3.enabled=true
s3.endpoint=http://buckets:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:TRINO_S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:TRINO_S3_SECRET_KEY}

