# StorScale Platform, on one machine: `storscale up` runs this file.
#
# One address: STORSCALE_DOMAIN (storscale.localhost) on STORSCALE_PORT (8800).
# The tools the platform shows in its frames are on paths of that address, so
# every browser (Safari included) treats them, and their cookies, as the
# platform's own:
#
#   http://storscale.localhost:8800/              the platform: one sign-in, every tool
#   http://storscale.localhost:8800/sso/          Keycloak: sign-in for everything
#   http://storscale.localhost:8800/notebooks/    JupyterHub
#   http://storscale.localhost:8800/dashboards/   Superset
#   http://storscale.localhost:8800/pipelines/    Airflow
#   http://storscale.localhost:8800/monitoring/   Grafana
#   http://storscale.localhost:8800/mcp           the MCP server: agents use the projects' metrics
#
# The tools that open in a tab of their own have names of their own:
#
#   http://catalog.storscale.localhost:8800       OpenMetadata: the catalog, lineage and data quality
#   http://access.storscale.localhost:8800        Apache Ranger (administrators)
#   http://s3.storscale.localhost:8800            Buckets' S3 API
#
# Browsers resolve *.localhost to this machine without a hosts file. Inside
# the stack, the same names resolve to the gateway, so every service uses the
# addresses a browser does, and Keycloak's tokens carry one issuer.
#
# Trino also listens on https://localhost:8443 for JDBC and CLI clients.
#
#   docker compose up -d --wait --build      (what `storscale up` does)
#   docker compose run --rm test             (what `storscale test` does)
#   docker compose down -v                   (what `storscale down --volumes` does)
#
# Every password is in .env, for local use only.
name: storscale

x-urls: &urls
  PLATFORM_URL: http://${STORSCALE_DOMAIN}:${STORSCALE_PORT}
  KEYCLOAK_URL: http://${STORSCALE_DOMAIN}:${STORSCALE_PORT}/sso
  NOTEBOOKS_URL: http://${STORSCALE_DOMAIN}:${STORSCALE_PORT}/notebooks
  DASHBOARDS_URL: http://${STORSCALE_DOMAIN}:${STORSCALE_PORT}/dashboards
  PIPELINES_URL: http://${STORSCALE_DOMAIN}:${STORSCALE_PORT}/pipelines
  MONITORING_URL: http://${STORSCALE_DOMAIN}:${STORSCALE_PORT}/monitoring
  CATALOG_PUBLIC_URL: http://catalog.${STORSCALE_DOMAIN}:${STORSCALE_PORT}   # realm.json's placeholders (setup/realm.py)

x-tools: &tools
  build: ./tools
  image: storscale-tools
  env_file: .env
  environment:
    <<: *urls
    PYTHONPATH: /tools
  volumes:
    - ./tools:/tools:ro
    - ./projects:/projects:ro
    - tls:/tls
    - prometheus-token:/token

x-superset: &superset
  build: ./superset/image
  image: storscale-superset
  env_file: .env
  environment:
    <<: *urls
    SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    SUPERSET_APP_ROOT: /dashboards   # served at the platform's /dashboards/
    MAPBOX_API_KEY: ${MAPBOX_API_KEY:-}   # the map charts' base map, if the company has a Mapbox key
  volumes:
    - ./superset:/app/pythonpath:ro
    - tls:/tls:ro

# Airflow runs every project's DAG code, so it gets the keys it needs and no
# others: not .env, which holds the platform's admin secrets. (Compose fills
# in the ${...} below from .env; the containers see only the results.)
x-airflow-env: &airflow-env
  <<: *urls
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__PARALLELISM: "4"   # LocalExecutor keeps this many workers; its default, 32, holds GBs
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/airflow
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
  AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
  AIRFLOW__API__BASE_URL: http://${STORSCALE_DOMAIN}:${STORSCALE_PORT}/pipelines
  # The API server (--proxy-headers) trusts X-Forwarded-* only from these;
  # uvicorn's default, 127.0.0.1, leaves out the gateway.
  FORWARDED_ALLOW_IPS: "*"
  AIRFLOW__API__PORT: "8090"
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow:8090/pipelines/execution/
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
  AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "10"
  # Projects' imports (dlt) write the lakehouse as its writers' Buckets account.
  COPY_S3_ACCESS_KEY: ${COPY_S3_ACCESS_KEY}
  COPY_S3_SECRET_KEY: ${COPY_S3_SECRET_KEY}

x-airflow: &airflow
  build: ./airflow/image
  image: storscale-airflow
  environment: *airflow-env
  volumes:
    - ./airflow/webserver_config.py:/opt/airflow/webserver_config.py:ro
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./tools/airflow_bundles.py:/tools/airflow_bundles.py:ro   # the bundles: the platform's DAGs, and projects' repos
    - trino-cert:/tls:ro   # Trino's certificate, not its key
    - catalog:/catalog:ro   # the catalog's token, for reporting lineage

# OpenMetadata's server, and its one-off database migration.
x-openmetadata: &openmetadata
  image: docker.getcollate.io/openmetadata/server:2.0.4
  environment:
    OPENMETADATA_HEAP_OPTS: -Xmx640m -Xms320m
    SERVER_HOST_API_URL: http://openmetadata:8585/api
    DB_DRIVER_CLASS: org.postgresql.Driver
    DB_SCHEME: postgresql
    DB_PARAMS: sslmode=disable
    DB_HOST: openmetadata-db
    DB_PORT: "5432"
    OM_DATABASE: openmetadata_db
    DB_USER: openmetadata_user
    DB_USER_PASSWORD: ${OPENMETADATA_DB_PASSWORD}
    SEARCH_TYPE: opensearch
    ELASTICSEARCH_HOST: openmetadata-search
    ELASTICSEARCH_PORT: "9200"
    ELASTICSEARCH_SCHEME: http
    # No Airflow of its own: the platform runs ingestion and tests (catalog-sync).
    PIPELINE_SERVICE_CLIENT_ENABLED: "false"
    FERNET_KEY: ${OPENMETADATA_FERNET_KEY}
    # People sign in with Keycloak (a confidential client: the server does the
    # OpenID Connect flow). Bots, such as the ingestion bot, use OpenMetadata's
    # own JWTs, so the server checks both kinds of key.
    AUTHENTICATION_PROVIDER: custom-oidc
    AUTHENTICATION_CLIENT_TYPE: confidential
    AUTHENTICATION_CLIENT_ID: openmetadata
    AUTHENTICATION_AUTHORITY: http://${STORSCALE_DOMAIN}:${STORSCALE_PORT}/sso/realms/lakehouse
    AUTHENTICATION_PUBLIC_KEYS: "[http://${STORSCALE_DOMAIN}:${STORSCALE_PORT}/sso/realms/lakehouse/protocol/openid-connect/certs,http://localhost:8585/api/v1/system/config/jwks]"
    AUTHENTICATION_CALLBACK_URL: http://catalog.${STORSCALE_DOMAIN}:${STORSCALE_PORT}/callback
    AUTHENTICATION_JWT_PRINCIPAL_CLAIMS: "[preferred_username,email,sub]"
    OIDC_TYPE: Keycloak
    OIDC_CLIENT_ID: openmetadata
    OIDC_CLIENT_SECRET: ${OPENMETADATA_OAUTH_SECRET}
    OIDC_DISCOVERY_URI: http://${STORSCALE_DOMAIN}:${STORSCALE_PORT}/sso/realms/lakehouse/.well-known/openid-configuration
    OIDC_CALLBACK: http://catalog.${STORSCALE_DOMAIN}:${STORSCALE_PORT}/callback
    OIDC_SERVER_URL: http://catalog.${STORSCALE_DOMAIN}:${STORSCALE_PORT}
    OIDC_SCOPE: openid email profile
    # Use the person's Keycloak session, as the other tools do: by default
    # OpenMetadata asks Keycloak for a fresh sign-in (max_age=0). OpenMetadata
    # copies these into its database when it first starts, and reads them from
    # there afterwards.
    OIDC_MAX_AGE: "28800"
    # Administrators: the platform operator's service account (which sets
    # the catalog up) and bob. Everyone else who signs in gets their own user.
    AUTHORIZER_ADMIN_PRINCIPALS: "[service-account-platform-operator,bob]"
    AUTHORIZER_PRINCIPAL_DOMAIN: ${STORSCALE_DOMAIN}

networks:
  default:
    name: storscale   # notebook containers join it (DockerSpawner.network_name)

services:
  # --- The gateway: one domain, a name per tool --------------------------------
  gateway:
    restart: unless-stopped
    image: caddy:2.11.2-alpine
    environment:
      STORSCALE_DOMAIN: ${STORSCALE_DOMAIN}
      GATEWAY_PORT: ${STORSCALE_PORT}
      PLATFORM_URL: http://${STORSCALE_DOMAIN}:${STORSCALE_PORT}
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./gateway/catalog:/srv/_storscale:ro
    ports: ["${STORSCALE_BIND:-127.0.0.1}:${STORSCALE_PORT}:${STORSCALE_PORT}"]
    networks:
      default:
        aliases:
          - ${STORSCALE_DOMAIN}
          - catalog.${STORSCALE_DOMAIN}
          - access.${STORSCALE_DOMAIN}
          - s3.${STORSCALE_DOMAIN}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${STORSCALE_PORT}/healthz"]
      interval: 5s
      retries: 60

  # --- Identity -------------------------------------------------------------------
  # The realm's signing key, made once and kept: tokens stay valid when
  # Keycloak restarts, and Trino and Buckets keep the keys they've fetched.
  keycloak-keys:
    <<: *tools
    command: ["sh", "-c", "test -s /keys/key.pem || (openssl req -x509 -newkey rsa:2048 -nodes -days 3650 -subj /CN=lakehouse -keyout /keys/key.pem -out /keys/cert.pem && chmod 644 /keys/*.pem)"]
    volumes:
      - keycloak-keys:/keys

  # Keycloak's database: the realm, people, sessions, kept through restarts.
  keycloak-db:
    restart: unless-stopped
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      retries: 60

  keycloak:
    restart: unless-stopped
    image: quay.io/keycloak/keycloak:26.8.0
    # In production mode, on its own database. The realm (keycloak/realm.json),
    # with the signing key from keycloak-keys, is imported only when there's
    # none yet; after that the realm is kept, and setup (setup/realm.py) keeps
    # the platform's own parts of it up to date.
    entrypoint: ["bash", "-c"]
    command:
      - |
        export KC_SIGNING_KEY="$$(grep -v -- ----- /keys/key.pem | tr -d '\n')"
        export KC_SIGNING_CERT="$$(grep -v -- ----- /keys/cert.pem | tr -d '\n')"
        exec /opt/keycloak/bin/kc.sh start --import-realm
    environment:
      # Its heap, set: without one, a JVM sizes it from the machine's memory.
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx384m
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # One issuer for everyone: tokens name the gateway's address, whoever asks.
      KC_HOSTNAME: http://${STORSCALE_DOMAIN}:${STORSCALE_PORT}/sso
      KC_HTTP_RELATIVE_PATH: /sso
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /   # its health checks stay at :9000/health
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"   # plain HTTP behind the gateway
      KC_CACHE: local           # one Keycloak
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # The realm's placeholders: people's password, redirect URIs, client secrets.
      PLATFORM_URL: http://${STORSCALE_DOMAIN}:${STORSCALE_PORT}
      CATALOG_PUBLIC_URL: http://catalog.${STORSCALE_DOMAIN}:${STORSCALE_PORT}
      LAKEHOUSE_USER_PASSWORD: ${LAKEHOUSE_USER_PASSWORD}
      JUPYTERHUB_OAUTH_SECRET: ${JUPYTERHUB_OAUTH_SECRET}
      PLATFORM_OAUTH_SECRET: ${PLATFORM_OAUTH_SECRET}
      OPERATOR_CLIENT_SECRET: ${OPERATOR_CLIENT_SECRET}
      SUPERSET_OAUTH_SECRET: ${SUPERSET_OAUTH_SECRET}
      GRAFANA_OAUTH_SECRET: ${GRAFANA_OAUTH_SECRET}
      OPENMETADATA_OAUTH_SECRET: ${OPENMETADATA_OAUTH_SECRET}
      AIRFLOW_OAUTH_SECRET: ${AIRFLOW_OAUTH_SECRET}
      AIRFLOW_PIPELINES_SECRET: ${AIRFLOW_PIPELINES_SECRET}
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/lakehouse-realm.json:ro
      - keycloak-keys:/keys:ro
    depends_on:
      gateway: {condition: service_healthy}
      keycloak-keys: {condition: service_completed_successfully}
      keycloak-db: {condition: service_healthy}
    healthcheck:
      # Ready = HTTP 200. (Its "not ready" answer holds "UP" too, in a check of its own.)
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]
      interval: 5s
      retries: 60

  # --- The platform: its web app, and platformd behind it -----------------------------
  platformd:
    restart: unless-stopped
    image: ${PLATFORMD_IMAGE}
    environment:
      TRINO_SHARED_SECRET: ${TRINO_SHARED_SECRET}   # Trino's finished queries come with it (usage, 13.1)
      MLFLOW_URL: http://mlflow:5000   # the projects' experiments and models (15.1), through platformd alone
      # What the catalog's Protection tags mean, as the operator applies them: shown on the Governance page (12.9).
      PROTECTION_TAGS: '{"personal": {"mask": "MASK_HASH", "except": ["engineers"]}, "financial": {"mask": "MASK", "except": ["engineers"]}, "health": {"mask": "MASK_NULL", "except": ["engineers"]}}'
      # The Health page, and alerts (where the platform's Secret storscale-alerts says).
      HEALTH: "on"
      GATEWAY_HEALTH_URL: http://gateway:${STORSCALE_PORT}/healthz
      # Project alerts: when a project's tables last changed (its freshness targets).
      NESSIE_URL: http://nessie:19120
      PLATFORM_URL: http://${STORSCALE_DOMAIN}:${STORSCALE_PORT}
      KEYCLOAK_URL: http://${STORSCALE_DOMAIN}:${STORSCALE_PORT}/sso
      KEYCLOAK_DIRECT_URL: http://keycloak:8080/sso
      OIDC_CLIENT_SECRET: ${PLATFORM_OAUTH_SECRET}
      # The project store: a bucket in Buckets, with platformd's own account.
      STORE_URL: http://buckets:9000
      STORE_ACCESS_KEY: ${PLATFORM_STORE_ACCESS_KEY}
      STORE_SECRET_KEY: ${PLATFORM_STORE_SECRET_KEY}
      # The catalog, for each project's Flow view, read with the token catalog-sync shares.
      CATALOG_URL: http://openmetadata:8585
      # The semantic layer, which platformd calls with the signed-in person's token.
      SEMANTIC_URL: http://semanticd:8000
      INSTALL_TARGET: development   # a project's repo's storscale/targets/development.yaml (use case 7.4)
      # The data-protection approvers: beside the administrators (bob), the
      # analysts (alice), so the example has one besides who changes a delivery.
      DELIVERY_APPROVER_GROUPS: engineers,analysts
      LLM_GATEWAY_URL: http://llm:4000
      LLM_GATEWAY_MASTER_KEY: ${LLM_MASTER_KEY:-sk-storscale-local}
      # Airflow, for the projects' pipelines and their runs, as the platform's own Airflow account.
      AIRFLOW_URL: http://airflow:8090/pipelines
      AIRFLOW_USER: storscale-platform
      AIRFLOW_PASSWORD: ${AIRFLOW_PLATFORM_PASSWORD}
      # Table maintenance, each night at MAINTENANCE_AT (UTC), as Trino's
      # maintenance account: every project's small files compacted.
      TRINO_URL: https://trino:8443
      TRINO_CA: /trino-cert/cert.pem
      MAINTENANCE_TRINO_PASSWORD: ${MAINTENANCE_TRINO_PASSWORD}
      # The audit log, beside Ranger's in its Solr; the platform's records kept a year.
      AUDIT_URL: http://ranger-solr:8983/solr/ranger_audits
      AUDIT_KEEP: 365d
      # How far back the tables' history goes (Nessie's GC), to say so.
      MAINTENANCE_KEEP_HISTORY: ${NESSIE_GC_KEEP}
    volumes:
      - catalog:/catalog:ro
      - trino-cert:/trino-cert:ro   # Trino's certificate, not its key
    depends_on:
      keycloak: {condition: service_healthy}
      tls: {condition: service_completed_successfully}
      ranger-solr: {condition: service_started}
    healthcheck:
      test: ["CMD", "/usr/bin/platformd", "healthcheck"]
      interval: 5s
      retries: 60

  # The semantic layer: projects' metrics (MetricFlow), run as whoever asks,
  # and the MCP server agents use them through (http://.../mcp).
  semanticd:
    restart: unless-stopped
    build: ./semantic
    image: storscale-semanticd
    environment:
      KEYCLOAK_URL: http://${STORSCALE_DOMAIN}:${STORSCALE_PORT}/sso
      KEYCLOAK_DIRECT_URL: http://keycloak:8080/sso
      MCP_URL: http://${STORSCALE_DOMAIN}:${STORSCALE_PORT}/mcp
      STORE_ACCESS_KEY: ${PLATFORM_STORE_ACCESS_KEY}
      STORE_SECRET_KEY: ${PLATFORM_STORE_SECRET_KEY}
    volumes:
      - tls:/tls:ro
    depends_on:
      keycloak: {condition: service_healthy}
      tls: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      retries: 60

  # The LLM gateway's stand-in (use case 12.1): keys with budgets, answers
  # that repeat the question. LiteLLM takes its place on an install with a
  # provider (the chart's llm.gateway: litellm).
  llm:
    <<: *tools
    restart: unless-stopped
    command: ["python", "-u", "/tools/llm_stub.py"]
    volumes:
      - ./tools:/tools:ro
    environment:
      LLM_MASTER_KEY: ${LLM_MASTER_KEY:-sk-storscale-local}
      LLM_GUARDRAILS: ${LLM_GUARDRAILS:-true}   # the guardrail (llm_guard.py): what may not leave is refused
      LLM_FORBIDDEN_TERMS: ${LLM_FORBIDDEN_TERMS:-Project Falcon}   # the install's own terms, one a line (the suite asks with this one)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 5s
      retries: 30

  # Applies projects to Keycloak, Ranger, Buckets and Nessie, and writes
  # back each one's status.
  platform-operator:
    restart: unless-stopped
    image: ${PLATFORMD_IMAGE}
    entrypoint: ["/usr/bin/platform-operator"]
    environment:
      STORE_URL: http://buckets:9000
      BUCKETS_ACCESS_KEY: ${BUCKETS_ROOT_USER}
      BUCKETS_SECRET_KEY: ${BUCKETS_ROOT_PASSWORD}
      KEYCLOAK_DIRECT_URL: http://keycloak:8080/sso
      OPERATOR_CLIENT_SECRET: ${OPERATOR_CLIENT_SECRET}
      # Registered assistants' Keycloak clients: their tokens are for the platform's MCP server.
      PLATFORM_URL: http://${STORSCALE_DOMAIN}:${STORSCALE_PORT}
      # What the catalog's Protection tags mean (use case 12.5): the engineers (the example's data-protection approvers) see such columns as they are.
      PROTECTION_TAGS: '{"personal": {"mask": "MASK_HASH", "except": ["engineers"]}, "financial": {"mask": "MASK", "except": ["engineers"]}, "health": {"mask": "MASK_NULL", "except": ["engineers"]}}'
      LLM_GATEWAY_URL: http://llm:4000
      LLM_GATEWAY_MASTER_KEY: ${LLM_MASTER_KEY:-sk-storscale-local}
      RANGER_URL: http://ranger-admin:6080
      RANGER_PASSWORD: ${RANGER_PASSWORD}
      NESSIE_URL: http://nessie:19120
      # Projects' pipelines repos: their git connections, through the platform's Airflow account.
      AIRFLOW_URL: http://airflow:8090/pipelines
      AIRFLOW_PASSWORD: ${AIRFLOW_PLATFORM_PASSWORD}
      # Projects' limits: Trino's resource groups, and the projects' buckets' sizes.
      TRINO_DB_PASSWORD: ${TRINO_DB_PASSWORD}
      # Projects' sources: Trino's catalogs of them, made as the operator's
      # Trino account; their connections in files Trino reads (trino-sources).
      TRINO_URL: https://trino:8443
      TRINO_CA: /trino-cert/cert.pem
      OPERATOR_TRINO_PASSWORD: ${OPERATOR_TRINO_PASSWORD}
      SOURCES_PATH: /sources
    volumes:
      - trino-sources:/sources
      - trino-cert:/trino-cert:ro
    depends_on:
      setup: {condition: service_completed_successfully}
      nessie: {condition: service_started}
      tls: {condition: service_completed_successfully}
      trino-passwords: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "/usr/bin/platform-operator", "healthcheck"]
      interval: 5s
      retries: 60

  # --- Storage: Buckets, one server with four drives (one erasure set, EC 2+2) -----
  drives:
    <<: *tools
    command: ["chown", "65532:65532", "/data1", "/data2", "/data3", "/data4"]
    volumes:
      - drive1:/data1
      - drive2:/data2
      - drive3:/data3
      - drive4:/data4

  buckets:
    restart: unless-stopped
    image: ${BUCKETS_IMAGE}
    command: ["server", "--address", ":9000", "/data1", "/data2", "/data3", "/data4"]
    environment:
      BUCKETS_ROOT_USER: ${BUCKETS_ROOT_USER}
      BUCKETS_ROOT_PASSWORD: ${BUCKETS_ROOT_PASSWORD}
      # People sign in with Keycloak; each of their groups names a Buckets policy.
      MINIO_IDENTITY_OPENID_CONFIG_URL: http://${STORSCALE_DOMAIN}:${STORSCALE_PORT}/sso/realms/lakehouse/.well-known/openid-configuration
      MINIO_IDENTITY_OPENID_CLIENT_ID: lakehouse
      MINIO_IDENTITY_OPENID_CLAIM_NAME: groups
      # Its audit log's copy on the first drive: at most this much (Buckets' default is 10G).
      BUCKETS_AUDIT_LOCAL_MAX: 1G
    volumes:
      - drive1:/data1
      - drive2:/data2
      - drive3:/data3
      - drive4:/data4
    depends_on:
      drives: {condition: service_completed_successfully}
      keycloak: {condition: service_healthy}

  # --- Access: Apache Ranger ---------------------------------------------------------
  ranger-db:
    restart: unless-stopped
    image: apache/ranger-db:2.9.0
    environment:
      POSTGRES_PASSWORD: ${RANGER_PASSWORD}
      RANGER_DB_USER: rangeradmin
      RANGER_DB_PASSWORD: ${RANGER_PASSWORD}
    volumes:
      - ranger-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ranger"]
      interval: 5s
      retries: 60

  ranger-solr:
    restart: unless-stopped
    image: apache/ranger-solr:2.9.0
    command: ["solr-precreate", "ranger_audits", "/opt/solr/server/solr/configsets/ranger_audits/"]
    environment:
      SOLR_HEAP: 256m
    volumes:
      - ranger-audits:/var/solr   # the audit log: Ranger's, and the platform's own

  ranger-admin:
    restart: unless-stopped
    image: apache/ranger:2.9.0
    # Ranger's start script pins a 1 GB heap (-Xms1g -Xmx1g): 512 MB is plenty
    # for the platform's policies, and the stack has to fit a laptop's Docker.
    entrypoint: ["bash", "-c"]
    command:
      - |
        f=/opt/ranger/admin/ews/ranger-admin-services.sh
        chmod u+w $$f && sed 's/^ranger_admin_max_heap_size=1g/ranger_admin_max_heap_size=512m/; s/-Xms1g/-Xms256m/' $$f > /tmp/services.sh &&
          cat /tmp/services.sh > $$f && exec /home/ranger/scripts/ranger.sh
    environment:
      RANGER_DB_TYPE: postgres
      POSTGRES_PASSWORD: ${RANGER_PASSWORD}
      RANGER_DB_USER: rangeradmin
      RANGER_DB_PASSWORD: ${RANGER_PASSWORD}
    volumes:
      - ./ranger/create-ranger-services.py:/home/ranger/scripts/create-ranger-services.py:ro
    depends_on:
      ranger-db: {condition: service_healthy}
      ranger-solr: {condition: service_started}
    healthcheck:
      # Healthy when its REST API asks for a sign-in (401): its login page
      # answers before the API does. Unauthenticated, so it never counts
      # toward Ranger's sign-in lockout.
      test: ["CMD-SHELL", "test \"$$(curl -s -o /dev/null -w '%{http_code}' http://localhost:6080/service/public/v2/api/servicedef)\" = 401"]
      interval: 10s
      start_period: 120s
      retries: 60

  # --- Setup, before Trino: buckets, policies, accounts; Ranger's people and policies
  setup:
    <<: *tools
    command: ["python", "-u", "/tools/setup/run.py", "base"]
    volumes:
      - ./tools:/tools:ro
      - ./projects:/projects:ro
      - ./keycloak:/keycloak:ro   # realm.json: the platform's parts of the realm
      - tls:/tls
      - prometheus-token:/token
    depends_on:
      keycloak: {condition: service_healthy}
      buckets: {condition: service_started}
      ranger-admin: {condition: service_healthy}

  # --- Tables: Nessie (the Iceberg catalog) and Trino --------------------------------
  # Nessie keeps the catalog (every table, its history, branches and tags)
  # in a Postgres of its own, which the backups dump with the others.
  nessie-db:
    restart: unless-stopped
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: nessie
      POSTGRES_USER: nessie
      POSTGRES_PASSWORD: ${NESSIE_DB_PASSWORD}
    volumes:
      - nessie-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nessie -d nessie"]
      interval: 5s
      retries: 60

  # --- Models: MLflow (use case 15.1) -----------------------------------------------------
  # One tracking server and registry, a workspace per project, reached only
  # through platformd (/mlflow/<project>/), which signs people in and names
  # the workspace; its artifacts in Buckets (the bucket mlflow), proxied.
  mlflow-db:
    restart: unless-stopped
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD}
    volumes:
      - mlflow-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      retries: 60

  mlflow:
    restart: unless-stopped
    build: ./mlflow
    image: storscale-mlflow
    environment:
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD}
      MLFLOW_ENABLE_WORKSPACES: "true"
      MLFLOW_SERVER_ALLOWED_HOSTS: mlflow:5000,mlflow,localhost:5000
      MLFLOW_S3_ENDPOINT_URL: http://buckets:9000
      AWS_ACCESS_KEY_ID: ${MLFLOW_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MLFLOW_S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      mlflow-db: {condition: service_healthy}
      setup: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      retries: 60

  # Before 0.9.0 the catalog was in RocksDB, on nessie-data: moved into
  # Postgres once, while Nessie is stopped (storscale down, then up, does),
  # then the RocksDB files are renamed, never read again (kept for a rollback).
  nessie-move:
    image: ghcr.io/projectnessie/nessie-server-admin:0.108.8
    entrypoint: ["bash", "-c"]
    command:
      - |
        if [ ! -d /home/nessie/catalog ]; then echo "nessie-move: no RocksDB catalog to move"; exit 0; fi
        set -e
        echo "nessie-move: exporting the RocksDB catalog"
        java -Dnessie.version.store.type=ROCKSDB -Dnessie.version.store.persist.rocks.database-path=/home/nessie/catalog \
          -jar /deployments/quarkus-run.jar export --path /home/nessie/rocksdb-export.zip
        echo "nessie-move: importing it into Postgres"
        java -jar /deployments/quarkus-run.jar import --path /home/nessie/rocksdb-export.zip --erase-before-import
        mv /home/nessie/catalog /home/nessie/catalog-rocksdb-moved
        echo "nessie-move: done; the RocksDB files are kept in catalog-rocksdb-moved"
    environment: &nessie-db
      nessie.version.store.type: JDBC2
      nessie.version.store.persist.jdbc.datasource: postgresql
      quarkus.datasource.postgresql.jdbc.url: jdbc:postgresql://nessie-db:5432/nessie
      quarkus.datasource.postgresql.username: nessie
      quarkus.datasource.postgresql.password: ${NESSIE_DB_PASSWORD}
    volumes:
      - nessie-data:/home/nessie
    depends_on:
      nessie-db: {condition: service_healthy}

  nessie:
    restart: unless-stopped
    image: ghcr.io/projectnessie/nessie:0.108.8
    environment:
      <<: *nessie-db
      JAVA_OPTS_APPEND: -Xms64m -Xmx256m
      nessie.catalog.default-warehouse: warehouse
      nessie.catalog.warehouses.warehouse.location: s3://warehouse/
      nessie.catalog.service.s3.default-options.endpoint: http://buckets:9000/
      nessie.catalog.service.s3.default-options.region: us-east-1
      nessie.catalog.service.s3.default-options.path-style-access: "true"
      nessie.catalog.service.s3.default-options.access-key: urn:nessie-secret:quarkus:nessie.catalog.secrets.access-key
      nessie.catalog.secrets.access-key.name: ${NESSIE_S3_ACCESS_KEY}
      nessie.catalog.secrets.access-key.secret: ${NESSIE_S3_SECRET_KEY}
    depends_on:
      setup: {condition: service_completed_successfully}
      nessie-move: {condition: service_completed_successfully}

  # Nessie's GC: the tables' history older than NESSIE_GC_KEEP, and files no
  # branch or tag needs, deleted from the warehouse, across the install (a
  # tag, such as a month-end close, keeps what it points to). Daily at 03:30
  # UTC, after the tables' compaction; or every NESSIE_GC_EVERY seconds.
  nessie-gc:
    restart: unless-stopped
    image: ghcr.io/projectnessie/nessie-gc:0.108.8
    entrypoint: ["bash", "-c"]
    command:
      - |
        while true; do
          if [ -n "$$NESSIE_GC_EVERY" ]; then
            sleep "$$NESSIE_GC_EVERY"
          else
            now=$$(date -u +%s); next=$$(date -u -d "today 03:30" +%s)
            [ "$$next" -gt "$$now" ] || next=$$((next + 86400))
            sleep $$((next - now))
          fi
          echo "nessie-gc: collecting what's older than $$NESSIE_GC_KEEP"
          java -jar /nessie-gc.jar gc --uri http://nessie:19120/api/v2 --inmemory --default-cutoff "$$NESSIE_GC_KEEP" \
            --iceberg s3.endpoint=http://buckets:9000/,s3.path-style-access=true \
            && echo "nessie-gc: done" || echo "nessie-gc: failed"
        done
    environment:
      NESSIE_GC_KEEP: ${NESSIE_GC_KEEP}
      NESSIE_GC_EVERY: ${NESSIE_GC_EVERY}
      AWS_ACCESS_KEY_ID: ${NESSIE_S3_ACCESS_KEY}   # Nessie's own account: the warehouse, nothing else
      AWS_SECRET_ACCESS_KEY: ${NESSIE_S3_SECRET_KEY}
      AWS_REGION: us-east-1
      JAVA_TOOL_OPTIONS: -Xmx384m
    depends_on:
      nessie: {condition: service_started}

  # Trino's self-signed certificate (Trino accepts tokens only over HTTPS),
  # and a copy of the certificate alone, for Airflow (trino-cert).
  tls:
    <<: *tools
    command: ["sh", "-c", "(test -s /tls/trino.pem || (openssl req -x509 -newkey rsa:2048 -nodes -days 365 -subj /CN=trino -addext subjectAltName=DNS:trino,DNS:localhost -keyout /tls/key.pem -out /tls/cert.pem && cat /tls/key.pem /tls/cert.pem > /tls/trino.pem && chmod 644 /tls/*.pem)) && cp /tls/cert.pem /cert/cert.pem && chmod 644 /cert/cert.pem"]
    volumes:
      - tls:/tls
      - trino-cert:/cert

  # Trino's password file (bcrypt): Superset, the catalog, table maintenance
  # and the platform operator sign in to Trino with passwords. And the
  # sources' directory, the operator's to write (it runs as 65532).
  trino-passwords:
    <<: *tools
    command: ["sh", "-c", "htpasswd -B -C 10 -b -c /auth/password.db superset \"$$SUPERSET_TRINO_PASSWORD\" && htpasswd -B -C 10 -b /auth/password.db openmetadata \"$$OPENMETADATA_TRINO_PASSWORD\" && htpasswd -B -C 10 -b /auth/password.db maintenance \"$$MAINTENANCE_TRINO_PASSWORD\" && htpasswd -B -C 10 -b /auth/password.db platform-operator \"$$OPERATOR_TRINO_PASSWORD\" && chmod 644 /auth/password.db && chown 65532:65532 /sources && chmod 755 /sources"]
    volumes:
      - trino-auth:/auth
      - trino-sources:/sources

  trino:
    restart: unless-stopped
    image: trinodb/trino:483
    # Its catalogs are made and dropped while it runs (the projects'
    # sources), in a directory of its own: the install's copied in first.
    command: ["sh", "-c", "mkdir -p /data/trino/catalog && cp /etc/trino/catalog-install/*.properties /data/trino/catalog/ && exec /usr/lib/trino/bin/run-trino"]
    environment:
      KEYCLOAK_URL: http://${STORSCALE_DOMAIN}:${STORSCALE_PORT}/sso
      TRINO_S3_ACCESS_KEY: ${TRINO_S3_ACCESS_KEY}
      TRINO_S3_SECRET_KEY: ${TRINO_S3_SECRET_KEY}
      TRINO_SHARED_SECRET: ${TRINO_SHARED_SECRET}
      RANGER_PLUGIN_PASSWORD: ${RANGER_PLUGIN_PASSWORD}
      TRINO_DB_PASSWORD: ${TRINO_DB_PASSWORD}   # its limits' database
    volumes:
      - ./trino/config.properties:/etc/trino/config.properties:ro
      - ./trino/catalog-store.properties:/etc/trino/catalog-store.properties:ro
      - ./trino/jvm.config:/etc/trino/jvm.config:ro
      - ./trino/password-authenticator.properties:/etc/trino/password-authenticator.properties:ro
      - ./trino/access-control.properties:/etc/trino/access-control.properties:ro
      - ./trino/ranger-trino-security.xml:/etc/trino/ranger-trino-security.xml:ro
      - ./trino/ranger-trino-audit.xml:/etc/trino/ranger-trino-audit.xml:ro
      - ./trino/resource-groups.properties:/etc/trino/resource-groups.properties:ro
      - ./trino/usage-events.properties:/etc/trino/usage-events.properties:ro
      - ./trino/catalog:/etc/trino/catalog-install:ro
      - tls:/etc/trino/tls:ro
      - trino-auth:/etc/trino/auth:ro
      - trino-sources:/etc/trino/sources:ro   # the sources' connections (the operator's)
    ports: ["${STORSCALE_BIND:-127.0.0.1}:8443:8443"]
    mem_limit: 2560m   # its heap is 60% of this (trino/jvm.config); a query gets at most 512 MB here
    depends_on:
      tls: {condition: service_completed_successfully}
      trino-passwords: {condition: service_completed_successfully}
      setup: {condition: service_completed_successfully}
      nessie: {condition: service_started}
      trino-db: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/info | grep -q '\"starting\":false'"]
      interval: 5s
      retries: 60

  # Trino's limits: its resource groups, which the platform operator keeps.
  trino-db:
    restart: unless-stopped
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: trino
      POSTGRES_USER: trino
      POSTGRES_PASSWORD: ${TRINO_DB_PASSWORD}
    volumes:
      - trino-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trino -d trino"]
      interval: 5s
      retries: 60

  # --- Setup, once Trino is up: Superset's and Airflow's policies; the sales tables --
  setup-trino:
    <<: *tools
    command: ["python", "-u", "/tools/setup/run.py", "trino"]
    depends_on:
      setup: {condition: service_completed_successfully}
      trino: {condition: service_healthy}
      platform-operator: {condition: service_healthy}

  # --- Notebooks: JupyterHub, a container per person ----------------------------------
  # Builds the image JupyterHub starts for each person, then exits.
  notebook:
    build: {context: ./jupyterhub/image, target: notebook}
    image: storscale-notebook
    command: ["true"]

  jupyterhub:
    restart: unless-stopped
    build: {context: ./jupyterhub/image, target: hub}
    image: storscale-jupyterhub
    command: ["jupyterhub", "-f", "/etc/jupyterhub/jupyterhub_config.py"]
    environment:
      <<: *urls
      JUPYTERHUB_OAUTH_SECRET: ${JUPYTERHUB_OAUTH_SECRET}
      JUPYTERHUB_CRYPT_KEY: ${JUPYTERHUB_CRYPT_KEY}
    volumes:
      - ./jupyterhub/jupyterhub_config.py:/etc/jupyterhub/jupyterhub_config.py:ro
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      - jupyterhub-data:/srv/jupyterhub/data
    depends_on:
      keycloak: {condition: service_healthy}
      setup: {condition: service_completed_successfully}
      notebook: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/notebooks/hub/health')"]
      interval: 5s
      retries: 60

  # --- Dashboards: Superset ---------------------------------------------------------------
  superset-db:
    restart: unless-stopped
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: ${SUPERSET_DB_PASSWORD}
    volumes:
      - superset-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 5s
      retries: 60

  # Superset's metadata database, roles and permissions, and the Trino database.
  superset-init:
    <<: *superset
    command: ["sh", "-c", "superset db upgrade && superset init && python /app/pythonpath/bootstrap.py"]
    depends_on:
      superset-db: {condition: service_healthy}

  superset:
    restart: unless-stopped
    <<: *superset
    depends_on:
      superset-init: {condition: service_completed_successfully}
      setup-trino: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8088/dashboards/health"]
      interval: 5s
      start_period: 30s
      retries: 60

  # Superset's datasets from the semantic models (use case 10.2), kept every minute.
  superset-sync:
    restart: unless-stopped
    <<: *superset
    command: ["python", "/app/pythonpath/semantic_sync.py"]
    # Not Superset's own check (its web server, which this doesn't run): a round lately.
    healthcheck:
      test: ["CMD", "python", "/app/pythonpath/semantic_sync.py", "healthy"]
      interval: 10s
      start_period: 120s
      retries: 30
    depends_on:
      superset-init: {condition: service_completed_successfully}

  # --- Pipelines: Airflow -------------------------------------------------------------------
  airflow-db:
    restart: unless-stopped
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    volumes:
      - airflow-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      retries: 60

  # Airflow's database, and its one secret: the pipelines' Keycloak client.
  airflow-init:
    <<: *airflow
    environment:
      <<: *airflow-env
      AIRFLOW_PLATFORM_PASSWORD: ${AIRFLOW_PLATFORM_PASSWORD}
      AIRFLOW_PIPELINES_SECRET: ${AIRFLOW_PIPELINES_SECRET}
    entrypoint: ["bash", "-c"]
    command:
      - |
        airflow db migrate && airflow fab-db migrate &&
        airflow connections delete keycloak_pipelines >/dev/null 2>&1;
        # The platform's own account, for the pipelines pages. (create exits 0
        # when the user exists, so the password is set again either way.)
        airflow users create --username storscale-platform --password "$$AIRFLOW_PLATFORM_PASSWORD" \
          --firstname StorScale --lastname Platform --email platform@storscale.localhost --role Op >/dev/null 2>&1;
        airflow users reset-password --username storscale-platform --password "$$AIRFLOW_PLATFORM_PASSWORD" >/dev/null &&
        airflow connections add keycloak_pipelines --conn-type http \
          --conn-host ${STORSCALE_DOMAIN} --conn-port ${STORSCALE_PORT} --conn-schema sso \
          --conn-login airflow-pipelines --conn-password "$$AIRFLOW_PIPELINES_SECRET" \
          --conn-description "The pipelines' Keycloak service account (client credentials)"
    depends_on:
      airflow-db: {condition: service_healthy}

  # The API server and UI.
  airflow:
    restart: unless-stopped
    <<: *airflow
    environment:
      <<: *airflow-env
      AIRFLOW_OAUTH_SECRET: ${AIRFLOW_OAUTH_SECRET}   # people's sign-in (webserver_config.py)
    command: ["api-server", "--proxy-headers"]   # the scheme people used, from the gateway
    depends_on:
      airflow-init: {condition: service_completed_successfully}
      setup-trino: {condition: service_completed_successfully}
      keycloak: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8090/pipelines/api/v2/monitor/health"]
      interval: 5s
      start_period: 30s
      retries: 60

  airflow-scheduler:
    restart: unless-stopped
    <<: *airflow
    command: ["python", "/tools/airflow_bundles.py", "airflow", "scheduler"]
    depends_on:
      airflow: {condition: service_healthy}

  airflow-dag-processor:
    restart: unless-stopped
    <<: *airflow
    command: ["python", "/tools/airflow_bundles.py", "airflow", "dag-processor"]
    depends_on:
      airflow: {condition: service_healthy}

  # --- Monitoring: Prometheus and Grafana -------------------------------------------------
  prometheus:
    restart: unless-stopped
    image: prom/prometheus:v3.13.4
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules.yaml:/etc/prometheus/rules.yaml:ro
      - prometheus-token:/etc/prometheus/token:ro
    depends_on:
      setup: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      retries: 60

  grafana:
    restart: unless-stopped
    image: grafana/grafana:13.0.10
    environment:
      GF_SERVER_ROOT_URL: http://${STORSCALE_DOMAIN}:${STORSCALE_PORT}/monitoring/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # The platform shows Grafana in a frame; the gateway says which pages may.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # People sign in with Keycloak: engineers edit dashboards, analysts view
      # them, and anyone in neither group is refused (role_attribute_strict).
      # The admin account above stays, for when Keycloak is down.
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OAUTH_SECRET}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      # Browsers go through the gateway; Grafana calls Keycloak directly.
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: http://${STORSCALE_DOMAIN}:${STORSCALE_PORT}/sso/realms/lakehouse/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://keycloak:8080/sso/realms/lakehouse/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://keycloak:8080/sso/realms/lakehouse/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH: groups
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'engineers') && 'Editor' || contains(groups[*], 'analysts') && 'Viewer'"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
      GF_AUTH_GENERIC_OAUTH_SKIP_ORG_ROLE_SYNC: "false"
      GF_AUTH_SIGNOUT_REDIRECT_URL: http://${STORSCALE_DOMAIN}:${STORSCALE_PORT}/sso/realms/lakehouse/protocol/openid-connect/logout
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards/buckets:ro
    depends_on:
      prometheus: {condition: service_healthy}
      keycloak: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/monitoring/api/health"]
      interval: 5s
      retries: 60

  # --- The catalog: OpenMetadata, with its own database and search -------------------
  openmetadata-db:
    restart: unless-stopped
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: openmetadata_db
      POSTGRES_USER: openmetadata_user
      POSTGRES_PASSWORD: ${OPENMETADATA_DB_PASSWORD}
    command: ["postgres", "-c", "work_mem=10MB"]
    volumes:
      - openmetadata-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openmetadata_user -d openmetadata_db"]
      interval: 5s
      retries: 60

  openmetadata-search:
    restart: unless-stopped
    build: ./catalog/opensearch
    image: storscale-opensearch
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms384m -Xmx384m
      # One node, on a laptop's disk: OpenSearch's thresholds (90% used, then 95%)
      # would make the catalog's indices read-only, and its lineage calls hang.
      cluster.routing.allocation.disk.threshold_enabled: "false"
    volumes:
      - openmetadata-search:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 5s
      start_period: 120s
      retries: 60

  openmetadata-migrate:
    <<: *openmetadata
    command: ["./bootstrap/openmetadata-ops.sh", "migrate"]
    depends_on:
      openmetadata-db: {condition: service_healthy}
      openmetadata-search: {condition: service_healthy}

  openmetadata:
    restart: unless-stopped
    <<: *openmetadata
    depends_on:
      openmetadata-migrate: {condition: service_completed_successfully}
      keycloak: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8586/healthcheck"]
      interval: 10s
      start_period: 60s
      retries: 60

  # Keeps the catalog in step: Trino's tables, the projects' checks, and the
  # ingestion bot's token in the catalog volume (for Airflow and platformd).
  catalog-sync:
    restart: unless-stopped
    build: ./catalog/sync
    image: storscale-catalog-sync
    environment:
      KEYCLOAK_DIRECT_URL: http://keycloak:8080/sso
      PIPELINES_URL: http://${STORSCALE_DOMAIN}:${STORSCALE_PORT}/pipelines
      OPERATOR_CLIENT_SECRET: ${OPERATOR_CLIENT_SECRET}
      OPENMETADATA_TRINO_PASSWORD: ${OPENMETADATA_TRINO_PASSWORD}
      STORE_ACCESS_KEY: ${PLATFORM_STORE_ACCESS_KEY}
      STORE_SECRET_KEY: ${PLATFORM_STORE_SECRET_KEY}
    volumes:
      - catalog:/catalog
      - tls:/tls:ro
    depends_on:
      openmetadata: {condition: service_healthy}
      setup-trino: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "test", "-s", "/catalog/token"]
      interval: 5s
      retries: 120

  # A little S3 traffic, so the storage dashboards have something to show.
  traffic:
    restart: unless-stopped
    <<: *tools
    command: ["python", "-u", "/tools/traffic.py"]
    depends_on:
      setup: {condition: service_completed_successfully}

  # --- The end-to-end checks: docker compose run --rm test [suite ...] --------------------
  test:
    <<: *tools
    entrypoint: ["python", "-u", "/tests/run.py"]
    command: []
    profiles: ["test"]
    volumes:
      - ./tools:/tools:ro
      - ./tests:/tests:ro
      - ./python:/python:ro   # the storscale package, as the api suite uses it
      - ./projects:/projects:ro
      - ./keycloak:/keycloak:ro
      - ./monitoring/dashboards:/dashboards:ro
      - tls:/tls
      - drive3:/drive3

  # The shell, in a real browser: docker compose run --rm test-browser
  test-browser:
    image: mcr.microsoft.com/playwright/python:v1.63.0-noble
    command: ["sh", "-c", "pip install -q --root-user-action=ignore playwright==1.63.0 && python -u /tests/shell.py"]
    shm_size: 1gb   # Chromium's shared memory: Docker's 64 MB crashes it on heavier pages
    oom_score_adj: 1000   # short of memory, the kernel stops the test browser, not the platform
    env_file: .env
    environment:
      SHELL_SWITCH: ${SHELL_SWITCH:-0}   # 1: also switch between tools in one page (CI)
    volumes:
      - ./tests:/tests:ro
    profiles: ["test"]

volumes:
  keycloak-db:
  nessie-db:
  mlflow-db:
  trino-db:
  catalog:
  openmetadata-db:
  openmetadata-search:
  keycloak-keys:
  drive1:
  drive2:
  drive3:
  drive4:
  ranger-db:
  nessie-data:
  tls:
  trino-cert:
  ranger-audits:
  trino-auth:
  trino-sources:
  prometheus-token:
  jupyterhub-data:
  superset-db:
  airflow-db:
