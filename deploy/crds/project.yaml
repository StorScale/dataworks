# The Project custom resource: StorScale DataWorks's central object, on
# Kubernetes. It has the same shape as the projects platformd keeps in its
# store (internal/project), and the platform operator applies it the same way.
# The operator reads Projects from Kubernetes from phase 5 (docs/plan.md);
# until then it reads them from the store.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: projects.platform.storscale.io
spec:
  group: platform.storscale.io
  scope: Namespaced
  names:
    kind: Project
    listKind: ProjectList
    plural: projects
    singular: project
    shortNames: [proj]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Members, type: integer, jsonPath: .status.memberCount}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [members]
              properties:
                description: {type: string, maxLength: 500}
                members:
                  type: array
                  minItems: 1
                  description: Keycloak groups or people, each with a role. A group's members are the project's for as long as they're in it.
                  items:
                    type: object
                    required: [role]
                    properties:
                      group: {type: string, maxLength: 100}
                      user: {type: string, maxLength: 100}
                      role: {type: string, pattern: '^[a-z][a-z0-9-]{1,23}$'}   # reader, editor, or a role the administrators define (16.1)
                    x-kubernetes-validations:
                      - rule: has(self.group) != has(self.user)
                        message: give a group or a user, not both
                tables:
                  type: object
                  description: An Iceberg namespace in Nessie, queried through Trino under Ranger's policies.
                  properties:
                    catalog: {type: string, default: iceberg, pattern: '^[a-z_][a-z0-9_]{0,62}$'}
                    namespace: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}$'}
                    readers:
                      type: object
                      description: What readers see. Editors and pipelines see everything.
                      properties:
                        tables:
                          type: array
                          items: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}$'}
                        rowFilters:
                          type: array
                          items:
                            type: object
                            required: [table, filter]
                            properties:
                              table: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}$'}
                              filter: {type: string, minLength: 1}
                        masks:
                          type: array
                          items:
                            type: object
                            required: [table, column, type]
                            properties:
                              table: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}$'}
                              column: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}$'}
                              type: {type: string, enum: [MASK, MASK_SHOW_LAST_4, MASK_SHOW_FIRST_4, MASK_HASH, MASK_NULL, MASK_NONE, MASK_DATE_SHOW_YEAR]}
                    tags:
                      description: "Moments of the tables kept (a month-end close, a delivery): each a Nessie tag (<project>.<name>) at a commit of the catalog, kept until keepUntil, whatever history is kept otherwise."
                      type: array
                      items:
                        type: object
                        required: [name, commit, keepUntil]
                        properties:
                          name: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$'}
                          commit: {type: string, pattern: '^[0-9a-f]{16,64}$', description: "The catalog's commit (on main) the tag keeps."}
                          keepUntil: {type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$', description: "A date: the tag is removed after it."}
                          note: {type: string, maxLength: 500}
                          by: {type: string, maxLength: 100, description: "Who made it."}
                    people:
                      description: "The tables holding people's data, each with the column identifying a person: a delivery of them sends personal data, and the delivery log is searched by a person's ID there."
                      type: array
                      items:
                        type: object
                        required: [table, column]
                        properties:
                          table: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}$'}
                          column: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}$'}
                    retention:
                      description: "Rows older than keep (by the column that dates them) are deleted by the nightly maintenance (use case 6.9, R6.27)."
                      type: array
                      items:
                        type: object
                        required: [table, column, keep]
                        properties:
                          table: {type: string}
                          column: {type: string}
                          keep: {type: string, pattern: '^[1-9][0-9]{0,4}(d|y)$'}
                    maintenance:
                      description: "How the platform keeps the tables in shape each night: small files compacted."
                      type: object
                      properties:
                        paused: {type: boolean, description: "No maintenance for now."}
                    freshness:
                      type: array
                      description: How recently each table must have changed; an older one is stale, and the project is told.
                      items:
                        type: object
                        required: [table, within]
                        properties:
                          table: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}$'}
                          within: {type: string, pattern: '^[1-9][0-9]{0,4}(m|h|d)$', description: "As 30m, 24h or 7d."}
                    checks:
                      type: array
                      description: Data-quality checks on the tables. The catalog runs them, and shows their results on the tables.
                      items:
                        type: object
                        required: [table, check]
                        properties:
                          name: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}$'}
                          table: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}$'}
                          column: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}$'}
                          check: {type: string, enum: [unique, notNull, rowCount, acceptedValues, range, regex, references, sql]}
                          min: {type: integer}
                          max: {type: integer}
                          values: {type: array, items: {type: string}}
                          pattern: {type: string}
                          refTable: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}$'}
                          refColumn: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}$'}
                          sql: {type: string}
                files:
                  type: object
                  description: A bucket in Buckets.
                  properties:
                    bucket: {type: string, pattern: '^[a-z][a-z0-9-]{1,38}[a-z0-9]$'}
                pipelines:
                  type: object
                  required: [serviceAccount]
                  description: >-
                    The Keycloak client whose service account runs the project's pipelines, and
                    the git repo their code (Airflow's DAGs) comes from.
                  properties:
                    serviceAccount: {type: string, maxLength: 100}
                    repo:
                      type: string
                      maxLength: 500
                      description: An https:// or ssh address of a git repo, never with credentials in it.
                    path: {type: string, maxLength: 200, description: "The DAGs' folder in the repo; default the whole repo."}
                    ref: {type: string, maxLength: 200, description: "A branch, tag or commit; default the install's own."}
                    credentials:
                      type: object
                      required: [secretRef]
                      description: >-
                        One of the project's connections, holding the repo's credentials: a
                        Secret in the project's namespace labelled
                        platform.storscale.io/connection=<project> (any other is refused), with
                        username and password (a token), or sshPrivateKey (the git hosts'
                        keys are the install's).
                      properties:
                        secretRef: {type: string, pattern: '^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$'}
                    memory:
                      type: string
                      pattern: '^[1-9][0-9]{0,5}(Mi|Gi)$'
                      description: "The project's own Airflow's memory, from 2Gi to 64Gi; default the install's (pipelines.memory)."
                    reviews:
                      type: object
                      description: >-
                        Each open merge request's change to the repo's dbt models, built and tested on a
                        data branch of its own (a Nessie branch), as the project's pipelines; the merge
                        request told how it went. GitLab: the repo's token reads merge requests and
                        writes statuses and notes.
                      required: [gitlab, dbt]
                      properties:
                        gitlab: {type: string, description: "GitLab's address: https://gitlab.example.com"}
                        project: {type: string, description: "The repo's path there (group/repo); default the repo URL's."}
                        dbt: {type: string, description: "The dbt project's folder in the repo."}
                notify:
                  type: object
                  description: >-
                    Where the project's alerts go (a failed pipeline, a failing check, a stale table):
                    teams names one of its connections, holding a Teams channel's Workflows webhook
                    (key webhook); slack one holding a Slack incoming webhook; email goes through the install's mail server.
                  properties:
                    teams: {type: string, pattern: '^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$'}
                    slack: {type: string, pattern: '^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$'}
                    email: {type: array, items: {type: string}}
                products:
                  description: "Tables the project publishes for others (data products): owner, version, contract, the business terms they hold; consumers and certification are the platform's."
                  type: array
                  items:
                    type: object
                    required: [name, table, owner, version]
                    properties:
                      name: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}$'}
                      table: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}$'}
                      description: {type: string}
                      owner: {type: string}
                      version: {type: string, maxLength: 20}
                      terms: {type: array, items: {type: string}}
                      contract:
                        type: object
                        properties:
                          columns: {type: array, items: {type: string}}
                          within: {type: string}
                          checks: {type: boolean}
                      consumers: {type: array, items: {type: string}, description: "The platform's: the projects approved to read it in place."}
                      certification:
                        type: object
                        description: "The platform's: who certified it, when, and what (its table, version and contract, hashed)."
                        properties:
                          by: {type: string}
                          at: {type: string}
                          hash: {type: string}
                semantic:
                  description: "How the project's semantic model stands among the others': shared, it's the company's (Customer, Revenue), for projects to build on; uses, the shared models this one builds on (and may not define again)."
                  type: object
                  properties:
                    shared: {type: boolean}
                    uses:
                      type: array
                      items: {type: string, pattern: '^[a-z][a-z0-9-]{1,38}[a-z0-9]$'}
                deliveries:
                  type: array
                  description: >-
                    Files sent to clients and partners on a schedule: a table or query of the project's,
                    in a format, split by a column if asked, compressed and PGP-encrypted, with a manifest,
                    to an SFTP server or an S3 bucket (connections). Each runs only once approved, and
                    again only once a change to what it sends is (changedBy and approval are the
                    platform's).
                  items:
                    type: object
                    required: [name, format, files, schedule, target]
                    properties:
                      name: {type: string, pattern: '^[a-z][a-z0-9_]{0,19}$'}
                      table: {type: string}
                      query: {type: string}
                      format: {type: string, enum: [csv, parquet, jsonl]}
                      gzip: {type: boolean}
                      files: {type: string, description: "The files' names: {date}, and {part} when split."}
                      splitBy: {type: string}
                      schedule: {type: string}
                      target: {type: string}
                      pgp: {type: string}
                      checks:
                        type: object
                        properties:
                          minRows: {type: integer, minimum: 0}
                          maxRows: {type: integer, minimum: 0}
                          within: {type: string}
                          parts: {type: array, items: {type: string}}
                      changedBy: {type: string}
                      approval:
                        type: object
                        properties:
                          hash: {type: string}
                          by: {type: array, items: {type: string}}
                          protection: {type: array, items: {type: string}}
                          at: {type: string}
                          done: {type: boolean}
                imports:
                  type: array
                  description: >-
                    An application's data, or a database's by a cursor column, copied into the project's
                    tables on a schedule (dlt, in the platform's Airflow): each resource into <import>_<name>,
                    merged on its primary key or appended, each run copying only what's new past its cursor.
                  items:
                    type: object
                    required: [name, source]
                    properties:
                      name: {type: string, pattern: '^[a-z][a-z0-9_]{0,19}$'}
                      source: {type: string, enum: [rest_api, sql_database, salesforce, gong, highspot, sap, files]}
                      connection: {type: string, pattern: '^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$'}
                      schedule: {type: string, description: "Cron (UTC), five fields; default hourly."}
                      api:
                        type: object
                        required: [baseUrl, resources]
                        properties:
                          baseUrl: {type: string}
                          resources:
                            type: array
                            items:
                              type: object
                              required: [name, path]
                              properties:
                                name: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}$'}
                                path: {type: string}
                                dataSelector: {type: string}
                                primaryKey: {type: string}
                                cursor: {type: string}
                                cursorParam: {type: string}
                                cursorStart: {type: string}
                      salesforce:
                        description: "Salesforce's objects to copy (dlt's verified Salesforce source), and how far back the objects copied by their changes start."
                        type: object
                        required: [objects]
                        properties:
                          objects:
                            type: array
                            items: {type: string, enum: [account, campaign, campaign_member, contact, event, lead, opportunity, opportunity_contact_role, opportunity_line_item, pricebook_2, pricebook_entry, product_2, sf_user, task, user_role]}
                          since: {type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'}
                      gong:
                        description: "Gong's objects to copy (the platform's connector, on Gong's API), and how far back the objects copied by their changes start."
                        type: object
                        required: [objects]
                        properties:
                          objects:
                            type: array
                            items: {type: string, enum: [users, calls, call_transcripts, scorecards, answered_scorecards]}
                          since: {type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'}
                      highspot:
                        description: "HighSpot's objects to copy (the platform's connector, on HighSpot's API)."
                        type: object
                        required: [objects]
                        properties:
                          objects:
                            type: array
                            items: {type: string, enum: [spots, items, users]}
                          since: {type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'}
                      sap:
                        description: "SAP S/4HANA's objects to copy (the platform's connector, on S/4HANA's OData APIs), and how far back those copied by their changes start."
                        type: object
                        required: [objects]
                        properties:
                          objects:
                            type: array
                            items: {type: string, enum: [business_partners, customers, suppliers, products, sales_orders, sales_order_items, billing_documents, billing_document_items, purchase_orders, purchase_order_items]}
                          since: {type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'}
                          odp:
                            description: "The company's own ODP extractions (CDS views or extractors served as OData by its gateway), copied whole once, then by SAP's delta, deletions included."
                            type: array
                            items:
                              type: object
                              required: [name, service, entitySet, primaryKey]
                              properties:
                                name: {type: string}
                                service: {type: string}
                                entitySet: {type: string}
                                primaryKey: {type: array, items: {type: string}}
                      files:
                        description: "Files of the project's landing area (landing/uploads/ in its bucket), each read into a table by its extension (csv, xlsx, jsonl, parquet); no connection: read as the project's pipelines."
                        type: object
                        required: [tables]
                        properties:
                          tables:
                            type: array
                            items:
                              type: object
                              required: [name, file]
                              properties:
                                name: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}$'}
                                file: {type: string}
                                primaryKey: {type: string}
                      database:
                        type: object
                        required: [kind, tables]
                        properties:
                          kind: {type: string, enum: [postgresql, mysql]}
                          tables:
                            type: array
                            items:
                              type: object
                              required: [table]
                              properties:
                                table: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}\.[a-z_][a-z0-9_]{0,62}$'}
                                cursor: {type: string}
                                primaryKey: {type: string}
                llm:
                  description: "The project's use of the LLM gateway (12.1): a key of its own with a monthly budget in USD, kept as its connection <project>-llm."
                  type: object
                  properties:
                    budget: {type: number}
                knowledge:
                  description: "Text the project's people and agents search by meaning (12.6): each bank's sources (a table's text column and its id column, or a folder of text files in the project's bucket) embedded through the gateway on the project's key, kept as the table knowledge_<name> in its namespace."
                  type: array
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: {type: string, pattern: '^[a-z_][a-z0-9_]{0,49}$'}
                      description: {type: string}
                      schedule: {type: string, description: "When the project's pipelines build it afresh (cron, UTC; the project needs pipelines); none: by hand."}
                      files:
                        type: array
                        items:
                          type: object
                          required: [prefix]
                          properties:
                            prefix: {type: string, description: "A folder of the project's bucket, as landing/docs/: its .txt, .md and .html files."}
                      tables:
                        type: array
                        items:
                          type: object
                          required: [table, column, id]
                          properties:
                            table: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}$'}
                            column: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}$'}
                            id: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}$'}
                scoring:
                  description: "Its approved models scoring its tables on a schedule (15.1): the registered model's approved version, a table's rows in, a table of scores out, as its pipelines; each run's drift against the first's."
                  type: array
                  items:
                    type: object
                    required: [name, model, table, id, output, schedule]
                    properties:
                      name: {type: string, pattern: '^[a-z][a-z0-9-]{0,40}$'}
                      model: {type: string}
                      table: {type: string}
                      id: {type: string}
                      columns: {type: array, items: {type: string}}
                      output: {type: string}
                      schedule: {type: string}
                      drift: {type: number}
                      maxRows: {type: integer}
                serving:
                  description: "Its approved models answering as an API (15.1): the registered model's approved version, served by a server of the project's, called through the platform by its people, each call audited."
                  type: array
                  items:
                    type: object
                    required: [name, model]
                    properties:
                      name: {type: string, pattern: '^[a-z][a-z0-9-]{0,15}$'}
                      model: {type: string}
                      memory: {type: string}
                      maxRows: {type: integer}
                apps:
                  description: "Small pages of the project's data (14.1), declared: a metric by a dimension, a table's columns, or questions answered from a knowledge bank; with filters; fetched as whoever opens them."
                  type: array
                  items:
                    type: object
                    required: [name, kind]
                    properties:
                      name: {type: string, pattern: '^[a-z][a-z0-9-]{0,40}$'}
                      title: {type: string}
                      description: {type: string}
                      kind: {type: string, enum: [metric, table, qa]}
                      metrics: {type: array, items: {type: string}}
                      by: {type: string}
                      table: {type: string}
                      columns: {type: array, items: {type: string}}
                      show: {type: string, enum: [table, bar, line, number]}
                      bank: {type: string}
                      limit: {type: integer}
                      filters:
                        type: array
                        items:
                          type: object
                          required: [field]
                          properties:
                            field: {type: string}
                            label: {type: string}
                            values: {type: array, items: {type: string}}
                cost:
                  description: "What the project may cost a month (13.1), priced by the install's rate card: alerted at 80% and 100%; nothing is stopped."
                  type: object
                  required: [budget]
                  properties:
                    budget: {type: number}
                tools:
                  description: "Tools of the project's own for its agents (12.7): an API's operation, signed in by one of the project's connections (an API token), called by the platform for the agents given it (tool:<name>) and the project's editors."
                  type: array
                  items:
                    type: object
                    required: [name, description, url, method, path]
                    properties:
                      name: {type: string, pattern: '^[a-z][a-z0-9_]{0,40}$'}
                      description: {type: string}
                      url: {type: string}
                      method: {type: string, enum: [GET, POST, PUT, PATCH, DELETE]}
                      path: {type: string}
                      connection: {type: string}
                      parameters:
                        type: array
                        items:
                          type: object
                          required: [name, in]
                          properties:
                            name: {type: string}
                            in: {type: string, enum: [path, query, body]}
                            type: {type: string, enum: [string, integer, number, boolean]}
                            description: {type: string}
                            required: {type: boolean}
                agents:
                  description: "Programs of the project's own (12.2): each an identity of its own, allowed the tools named, approved by an editor other than its registrant; who registered and approved are the platform's."
                  type: array
                  items:
                    type: object
                    required: [name, owner]
                    properties:
                      name: {type: string, pattern: '^[a-z][a-z0-9-]{0,30}$'}
                      description: {type: string}
                      owner: {type: string}
                      tools: {type: array, items: {type: string, pattern: '^(list_projects|list_metrics|query_metrics|explain_query|list_terms|describe_term|search_terms|list_products|describe_product|query_product|list_runs|list_alerts|search_documents|list_tools|call_tool|ask_agent|agent:[a-z][a-z0-9-]{2,39}/[a-z][a-z0-9-]{0,30}|tool:[a-z][a-z0-9_]{0,40})$'}}
                      schedule: {type: string, description: "When the platform runs it (cron, UTC), with a notebook."}
                      notebook: {type: string, description: "Its program: an .ipynb in the project's repo, under the pipelines' path, run as the agent on its schedule."}
                      prompt: {type: string, maxLength: 8000}
                      budget: {type: number, description: "USD a month at the LLM gateway (12.1); none: no key."}
                      registeredBy: {type: string}
                      registeredAt: {type: string}
                      approvedBy: {type: string}
                      approvedAt: {type: string}
                sources:
                  type: array
                  description: >-
                    The company's databases the project queries where they are: each a Trino catalog
                    <project>_<name>, read-only, which its editors and pipelines (and its readers, if
                    readers is true) may read. connection names one of its connections: url (JDBC), or
                    host, port and database; username and password (the database's read-only account).
                  items:
                    type: object
                    required: [name, kind, connection]
                    properties:
                      name: {type: string, pattern: '^[a-z][a-z0-9_]{0,19}$'}
                      kind: {type: string, enum: [postgresql, mysql, sqlserver, oracle]}
                      connection: {type: string, pattern: '^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$'}
                      readers: {type: boolean, description: "Its readers may read it too; default false (editors and pipelines only)."}
                      copy:
                        type: object
                        description: >-
                          Its tables copied into the project's by change capture (Kubernetes): a first copy,
                          then every change, within minutes; each as <source>_<table> in the project's namespace.
                          Its account needs the database's change log (PostgreSQL REPLICATION and wal_level=logical,
                          SQL Server CDC, MySQL's row binlog).
                        required: [tables]
                        properties:
                          tables:
                            type: array
                            items: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}\.[a-z_][a-z0-9_]{0,62}$'}
                      schemas:
                        type: array
                        description: The only schemas of it the project may read; default all.
                        items: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}$'}
                      rowFilters:
                        type: array
                        description: What its readers see of a table (schema.table), as a SQL condition.
                        items:
                          type: object
                          required: [table, filter]
                          properties:
                            table: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}\.[a-z_][a-z0-9_]{0,62}$'}
                            filter: {type: string, minLength: 1}
                      masks:
                        type: array
                        description: Columns its readers see masked (the table as schema.table).
                        items:
                          type: object
                          required: [table, column, type]
                          properties:
                            table: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}\.[a-z_][a-z0-9_]{0,62}$'}
                            column: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}$'}
                            type: {type: string, enum: [MASK, MASK_SHOW_LAST_4, MASK_SHOW_FIRST_4, MASK_HASH, MASK_NULL, MASK_NONE, MASK_DATE_SHOW_YEAR]}
                limits:
                  type: object
                  description: >-
                    The project's share of the platform, so it can't slow the others; what's left out
                    is the install's default (limits.project). Trino queries count against it when a
                    member names the project (client tag project:<name>), and all its pipelines' queries.
                  properties:
                    queries: {type: integer, minimum: 0, maximum: 100, description: "Trino queries running at once."}
                    queued: {type: integer, minimum: 0, maximum: 1000, description: "Queries waiting; more are refused."}
                    queryMemory:
                      type: string
                      pattern: '^([1-9][0-9]{0,5}(MB|GB)|([1-9][0-9]?|100)%)$'
                      description: "Trino memory for the project's queries: 4GB, or 50% of Trino's."
                    storage:
                      type: string
                      pattern: '^[1-9][0-9]{0,5}(Gi|Ti)$'
                      description: "Its bucket's size: 500Gi, 2Ti."
