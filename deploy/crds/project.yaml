# The Project custom resource: StorScale Platform's central object, on
# Kubernetes. It has the same shape as the projects platformd keeps in its
# store (internal/project), and the platform operator applies it the same way.
# The operator reads Projects from Kubernetes from phase 5 (docs/plan.md);
# until then it reads them from the store.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: projects.platform.storscale.io
spec:
  group: platform.storscale.io
  scope: Namespaced
  names:
    kind: Project
    listKind: ProjectList
    plural: projects
    singular: project
    shortNames: [proj]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Members, type: integer, jsonPath: .status.memberCount}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [members]
              properties:
                description: {type: string, maxLength: 500}
                members:
                  type: array
                  minItems: 1
                  description: Keycloak groups or people, each with a role. A group's members are the project's for as long as they're in it.
                  items:
                    type: object
                    required: [role]
                    properties:
                      group: {type: string, maxLength: 100}
                      user: {type: string, maxLength: 100}
                      role: {type: string, enum: [reader, editor]}
                    x-kubernetes-validations:
                      - rule: has(self.group) != has(self.user)
                        message: give a group or a user, not both
                tables:
                  type: object
                  description: An Iceberg namespace in Nessie, queried through Trino under Ranger's policies.
                  properties:
                    catalog: {type: string, default: iceberg, pattern: '^[a-z_][a-z0-9_]{0,62}$'}
                    namespace: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}$'}
                    readers:
                      type: object
                      description: What readers see. Editors and pipelines see everything.
                      properties:
                        tables:
                          type: array
                          items: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}$'}
                        rowFilters:
                          type: array
                          items:
                            type: object
                            required: [table, filter]
                            properties:
                              table: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}$'}
                              filter: {type: string, minLength: 1}
                        masks:
                          type: array
                          items:
                            type: object
                            required: [table, column, type]
                            properties:
                              table: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}$'}
                              column: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}$'}
                              type: {type: string, enum: [MASK, MASK_SHOW_LAST_4, MASK_SHOW_FIRST_4, MASK_HASH, MASK_NULL, MASK_NONE, MASK_DATE_SHOW_YEAR]}
                    tags:
                      description: "Moments of the tables kept (a month-end close, a delivery): each a Nessie tag (<project>.<name>) at a commit of the catalog, kept until keepUntil, whatever history is kept otherwise."
                      type: array
                      items:
                        type: object
                        required: [name, commit, keepUntil]
                        properties:
                          name: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$'}
                          commit: {type: string, pattern: '^[0-9a-f]{16,64}$', description: "The catalog's commit (on main) the tag keeps."}
                          keepUntil: {type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$', description: "A date: the tag is removed after it."}
                          note: {type: string, maxLength: 500}
                          by: {type: string, maxLength: 100, description: "Who made it."}
                    maintenance:
                      description: "How the platform keeps the tables in shape each night: small files compacted."
                      type: object
                      properties:
                        paused: {type: boolean, description: "No maintenance for now."}
                    freshness:
                      type: array
                      description: How recently each table must have changed; an older one is stale, and the project is told.
                      items:
                        type: object
                        required: [table, within]
                        properties:
                          table: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}$'}
                          within: {type: string, pattern: '^[1-9][0-9]{0,4}(m|h|d)$', description: "As 30m, 24h or 7d."}
                    checks:
                      type: array
                      description: Data-quality checks on the tables. The catalog runs them, and shows their results on the tables.
                      items:
                        type: object
                        required: [table, check]
                        properties:
                          table: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}$'}
                          column: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}$'}
                          check: {type: string, enum: [unique, notNull, rowCount]}
                          min: {type: integer}
                          max: {type: integer}
                files:
                  type: object
                  description: A bucket in Buckets.
                  properties:
                    bucket: {type: string, pattern: '^[a-z][a-z0-9-]{1,38}[a-z0-9]$'}
                pipelines:
                  type: object
                  required: [serviceAccount]
                  description: >-
                    The Keycloak client whose service account runs the project's pipelines, and
                    the git repo their code (Airflow's DAGs) comes from.
                  properties:
                    serviceAccount: {type: string, maxLength: 100}
                    repo:
                      type: string
                      maxLength: 500
                      description: An https:// or ssh address of a git repo, never with credentials in it.
                    path: {type: string, maxLength: 200, description: "The DAGs' folder in the repo; default the whole repo."}
                    ref: {type: string, maxLength: 200, description: "A branch, tag or commit; default the install's own."}
                    credentials:
                      type: object
                      required: [secretRef]
                      description: >-
                        One of the project's connections, holding the repo's credentials: a
                        Secret in the project's namespace labelled
                        platform.storscale.io/connection=<project> (any other is refused), with
                        username and password (a token), or sshPrivateKey (the git hosts'
                        keys are the install's).
                      properties:
                        secretRef: {type: string, pattern: '^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$'}
                    memory:
                      type: string
                      pattern: '^[1-9][0-9]{0,5}(Mi|Gi)$'
                      description: "The project's own Airflow's memory, from 2Gi to 64Gi; default the install's (pipelines.memory)."
                notify:
                  type: object
                  description: >-
                    Where the project's alerts go (a failed pipeline, a failing check, a stale table):
                    teams names one of its connections, holding a Teams channel's Workflows webhook
                    (key webhook); email goes through the install's mail server.
                  properties:
                    teams: {type: string, pattern: '^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$'}
                    email: {type: array, items: {type: string}}
                imports:
                  type: array
                  description: >-
                    An application's data, or a database's by a cursor column, copied into the project's
                    tables on a schedule (dlt, in the platform's Airflow): each resource into <import>_<name>,
                    merged on its primary key or appended, each run copying only what's new past its cursor.
                  items:
                    type: object
                    required: [name, source]
                    properties:
                      name: {type: string, pattern: '^[a-z][a-z0-9_]{0,19}$'}
                      source: {type: string, enum: [rest_api, sql_database]}
                      connection: {type: string, pattern: '^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$'}
                      schedule: {type: string, description: "Cron (UTC), five fields; default hourly."}
                      api:
                        type: object
                        required: [baseUrl, resources]
                        properties:
                          baseUrl: {type: string}
                          resources:
                            type: array
                            items:
                              type: object
                              required: [name, path]
                              properties:
                                name: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}$'}
                                path: {type: string}
                                dataSelector: {type: string}
                                primaryKey: {type: string}
                                cursor: {type: string}
                                cursorParam: {type: string}
                                cursorStart: {type: string}
                      database:
                        type: object
                        required: [kind, tables]
                        properties:
                          kind: {type: string, enum: [postgresql, mysql]}
                          tables:
                            type: array
                            items:
                              type: object
                              required: [table]
                              properties:
                                table: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}\.[a-z_][a-z0-9_]{0,62}$'}
                                cursor: {type: string}
                                primaryKey: {type: string}
                sources:
                  type: array
                  description: >-
                    The company's databases the project queries where they are: each a Trino catalog
                    <project>_<name>, read-only, which its editors and pipelines (and its readers, if
                    readers is true) may read. connection names one of its connections: url (JDBC), or
                    host, port and database; username and password (the database's read-only account).
                  items:
                    type: object
                    required: [name, kind, connection]
                    properties:
                      name: {type: string, pattern: '^[a-z][a-z0-9_]{0,19}$'}
                      kind: {type: string, enum: [postgresql, mysql, sqlserver, oracle]}
                      connection: {type: string, pattern: '^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$'}
                      readers: {type: boolean, description: "Its readers may read it too; default false (editors and pipelines only)."}
                      copy:
                        type: object
                        description: >-
                          Its tables copied into the project's by change capture (Kubernetes): a first copy,
                          then every change, within minutes; each as <source>_<table> in the project's namespace.
                          Its account needs the database's change log (PostgreSQL REPLICATION and wal_level=logical,
                          SQL Server CDC, MySQL's row binlog).
                        required: [tables]
                        properties:
                          tables:
                            type: array
                            items: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}\.[a-z_][a-z0-9_]{0,62}$'}
                      schemas:
                        type: array
                        description: The only schemas of it the project may read; default all.
                        items: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}$'}
                      rowFilters:
                        type: array
                        description: What its readers see of a table (schema.table), as a SQL condition.
                        items:
                          type: object
                          required: [table, filter]
                          properties:
                            table: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}\.[a-z_][a-z0-9_]{0,62}$'}
                            filter: {type: string, minLength: 1}
                      masks:
                        type: array
                        description: Columns its readers see masked (the table as schema.table).
                        items:
                          type: object
                          required: [table, column, type]
                          properties:
                            table: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}\.[a-z_][a-z0-9_]{0,62}$'}
                            column: {type: string, pattern: '^[a-z_][a-z0-9_]{0,62}$'}
                            type: {type: string, enum: [MASK, MASK_SHOW_LAST_4, MASK_SHOW_FIRST_4, MASK_HASH, MASK_NULL, MASK_NONE, MASK_DATE_SHOW_YEAR]}
                limits:
                  type: object
                  description: >-
                    The project's share of the platform, so it can't slow the others; what's left out
                    is the install's default (limits.project). Trino queries count against it when a
                    member names the project (client tag project:<name>), and all its pipelines' queries.
                  properties:
                    queries: {type: integer, minimum: 0, maximum: 100, description: "Trino queries running at once."}
                    queued: {type: integer, minimum: 0, maximum: 1000, description: "Queries waiting; more are refused."}
                    queryMemory:
                      type: string
                      pattern: '^([1-9][0-9]{0,5}(MB|GB)|([1-9][0-9]?|100)%)$'
                      description: "Trino memory for the project's queries: 4GB, or 50% of Trino's."
                    storage:
                      type: string
                      pattern: '^[1-9][0-9]{0,5}(Gi|Ti)$'
                      description: "Its bucket's size: 500Gi, 2Ti."
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
