# StorScale Platform's chart. The defaults run the whole platform on one
# kind node (deploy/kind/cluster.yaml); `storscale up --k8s` installs it so.

global:
  # The platform's one address, scheme://domain:port: people's browsers and
  # the services use it. The port is left out of it when it's the scheme's
  # own, so behind an ingress that ends TLS: scheme https, port 443.
  domain: storscale.localhost
  port: 8800
  scheme: http
  # Certificate authorities to trust besides the public ones: the one that
  # signs the platform's certificate, when it's private. The services call
  # the platform at its public address too (Keycloak's tokens name it), so
  # they must trust its certificate as people's browsers do. Give the CAs as
  # PEM (--set-file global.ca.certs=root-ca.pem), or name a ConfigMap in the
  # release's namespace that holds them (trust-manager's Bundles make these).
  ca:
    certs: ""
    configMap: ""
    key: ca.crt   # the ConfigMap's key

# The platform's brand. In its top bar's corner: StorScale's icon and name;
# a logo of your own takes their place, and the name becomes its text for
# screen readers. In the browser's tab: the title ("<name> Platform" unless
# given) and an icon, square, as a tab shows it (StorScale's unless given).
# Images are SVG, PNG, JPEG, GIF, WebP or ICO, base64:
#   base64 -w0 logo.svg > logo.b64; --set-file brand.logo=logo.b64
brand:
  name: StorScale
  title: ""
  logo: ""
  icon: ""

# The images built from this repository (stack/*/Dockerfile and platformd's).
images:
  registry: ghcr.io/storscale
  tag: ""             # defaults to the chart's appVersion
  pullPolicy: IfNotPresent
  platformd: platformd
  tools: platform-tools
  airflow: platform-airflow
  superset: platform-superset
  jupyterhub: platform-jupyterhub
  notebook: platform-notebook
  opensearch: platform-opensearch
  semanticd: platform-semanticd
  catalogSync: platform-catalog-sync

# Everything else comes from its project's own image.
upstream:
  caddy: caddy:2.11.2-alpine
  keycloak: quay.io/keycloak/keycloak:26.8.0
  postgres: postgres:18-bookworm
  rangerAdmin: apache/ranger:2.9.0
  rangerDb: apache/ranger-db:2.9.0
  rangerSolr: apache/ranger-solr:2.9.0
  nessie: ghcr.io/projectnessie/nessie:0.108.8
  nessieGc: ghcr.io/projectnessie/nessie-gc:0.108.8
  nessieAdmin: ghcr.io/projectnessie/nessie-server-admin:0.108.8
  trino: trinodb/trino:483
  debezium: ghcr.io/memiiso/debezium-server-iceberg:1.2.0.Final   # a project's sources' copies (change capture into Iceberg)
  openmetadata: docker.getcollate.io/openmetadata/server:2.0.4
  prometheus: prom/prometheus:v3.13.4
  grafana: grafana/grafana:13.0.10
  bucketsd: ghcr.io/storscale/bucketsd:1.19.0

# The gateway: every address of the platform, as one Service. It listens on
# its own port over plain HTTP, whatever the platform's address is. The platform's
# names (domain, and catalog., access., s3. under it) must resolve to it from
# inside the cluster too, as from people's browsers: through the domain's DNS
# (an ingress or load balancer), or, on kind, through the cluster's DNS
# (deploy/kind/dns.sh), as Compose's network aliases do.
gateway:
  port: 8800
  # Proxies whose X-Forwarded-* headers the gateway passes on, so the tools
  # see the scheme people used: Caddy's trusted_proxies ranges, such as
  # "private_ranges" or CIDRs. Defaults to private_ranges with the ingress on.
  trustedProxies: ""
  service:
    type: NodePort
    nodePort: 30880   # kind maps the host's port 8800 here
  ingress:
    enabled: false
    className: ""
    annotations: {}   # such as cert-manager.io/cluster-issuer, for its certificate
    tls: []           # [{secretName, hosts}]; hosts default to the domain, and catalog., access., s3. under it

# Trino's HTTPS port, for JDBC and CLI clients outside the cluster.
trino:
  service:
    type: NodePort
    nodePort: 30443   # kind maps the host's port 8443 here
  memory: 1536Mi      # its heap is 60% of this (stack/trino/jvm.config): the rest is its code cache, metadata and the catalogs' clients
  # Workers beside the coordinator, which then plans and hands out queries'
  # tasks: more of them, more queries at once (and no one pod's loss stops
  # them). 0: the coordinator does the work itself.
  workers: 0
  workerMemory: ""    # default: memory, above

# How long a Deployment may take to become ready before Kubernetes calls its
# rollout failed (its default is 10 minutes). On a first install, services
# wait for the setup steps, and those for Keycloak, Buckets, Ranger and
# Trino: with every image still to pull, that takes longer.
progressDeadlineSeconds: 3600

# Every secret the platform needs, as `.env` holds them in Compose. Each one
# is generated on install and kept on upgrade; give a value here to choose it.
secrets: {}
#  LAKEHOUSE_USER_PASSWORD: ...

# The example people (alice, bob, carol) and their groups, from the realm.
examples:
  users: true

buckets:
  servers: 1
  volumesPerServer: 4
  storage: 10Gi
  storageClassName: ""   # the cluster's default
  # Each server keeps a copy of its audit log on its first drive, for 30
  # days or this much, whichever comes first (Buckets' default is 10G).
  auditLocalMax: 1G

storage:
  storageClassName: ""   # for the databases, Nessie, JupyterHub and the catalog
  postgres: 8Gi
  nessie: 2Gi
  jupyterhub: 1Gi
  opensearch: 4Gi

# Projects' pipelines repos (their Airflow DAGs, from git). Each project with
# a repo gets an Airflow of its own, at the platform's /airflow/<project>/.
pipelines:
  defaultRef: main     # the branch a repo is followed on when its project names none
  memory: 3Gi          # a project's Airflow's, when it names none (pipelines.memory: 2Gi to 64Gi)
  # The git hosts' SSH keys (an ssh_known_hosts file), for SSH repos:
  #   --set-file pipelines.gitKnownHosts=known_hosts   (ssh-keyscan git.example.com)
  # Without them, a host's key is taken the first time it's seen.
  gitKnownHosts: ""

# Projects' sources copied into their tables by change capture (use case 8.1):
# a pod per copying source, which the operator makes.
copy:
  memory: 1Gi
  commitEvery: 30   # seconds at most between a change and its commit to the table

# The platform's Postgres with wal_level=logical: a source on it can be copied
# (CI's checks use one). Off: it costs WAL, and the platform's own databases
# aren't sources.
postgres:
  logicalReplication: false

# High availability: how many pods of each stateless service, spread across
# nodes, each with a disruption budget when more than one. Nessie runs more
# than one only after the upgrade that moves its catalog into Postgres
# (0.9.0). Keycloak's pods find each other through its database. platformd
# and the operator stay one each, as do the databases (see docs/plan.md).
replicas:
  gateway: 1
  keycloak: 1
  nessie: 1
  semanticd: 1
  superset: 1
  airflow: 1

# Network policies: nothing reaches the platform's pods unless it should.
# The gateway takes connections from anywhere (it's the way in), Trino's
# 8443 too (JDBC clients); the databases, Ranger's audit index, the
# catalog's search index and Keycloak only from the services that use them;
# every other service only from the namespace's own pods. Needs a CNI that
# enforces them (most do; kind's does).
networkPolicies:
  enabled: true

# The audit log: who changed what in the platform, and every access Trino
# allowed or refused (Ranger's), in Ranger's Solr, on a volume this size.
# Kept for keep (the platform's own records; Ranger keeps its own 90 days).
audit:
  storage: 5Gi
  keep: 365d

# Backups: each night (schedule, UTC) every database (the platform's Postgres,
# Nessie's catalog among them, and Ranger's) is dumped, and the Projects and
# Secrets exported, packed, encrypted for `certificate` and kept in `bucket`
# (the newest `keep`). Off until `certificate` is set: make a key pair with
#   storscale backup keygen --out DIR
# then --set-file backup.certificate=DIR/storscale-backup-cert.pem, and keep
# DIR/storscale-backup-key.pem somewhere else than this cluster: without it,
# no backup can be restored. s3: where; "" is the platform's own Buckets
# (which a lost cluster takes with it), else an S3 endpoint with a Secret
# (s3.secretName) holding accessKey and secretKey.
backup:
  certificate: ""
  schedule: "0 4 * * *"
  keep: 14
  bucket: storscale-backups
  s3:
    endpoint: ""
    region: us-east-1
    secretName: ""
  # The data itself, for when the cluster is lost: every bucket (the lake,
  # the projects', the platform's) copied to backup.s3, nightly, what changed
  # since. Needs backup.s3.endpoint: a copy kept in the cluster's own Buckets
  # protects from nothing (allowInternal: for tests alone).
  data:
    enabled: false
    schedule: "30 4 * * *"
    allowInternal: false

# Table maintenance: each night at `at` (UTC), platformd compacts every
# project's small files (a project's tables.maintenance may pause it). Then
# Nessie's GC (history.schedule) deletes the tables' history older than
# history.keep (ISO 8601: P7D, a week) and files no branch or tag needs,
# across the install; a tag, as a month-end close, keeps what it points to.
maintenance:
  at: "02:00"
  history:
    keep: P7D
    schedule: "30 3 * * *"

# Limits, so no one project or person slows the others. A project's own
# (spec.limits) replace these; Trino queries count against a project when one
# of its members names it (client tag project:<name>, as the platform's SQL
# page and metrics do), and all its own pipelines'; the rest count against
# the person. Notebooks are a person's (notebooks.memoryLimit, cpuLimit).
limits:
  project:
    queries: 4          # Trino queries running at once
    queued: 40          # waiting; more are refused
    queryMemory: "50%"  # of Trino's memory, or as 4GB
    storage: ""         # its bucket's size, as 500Gi; "": none
  person:
    queries: 4
    queued: 100
  total:
    queries: 20         # the whole install's
    queued: 1000

notebooks:
  memoryLimit: 1G
  cpuLimit: 2           # CPUs, each person's notebook
  storage: 1Gi

buckets-operator:
  enabled: true
  replicaCount: 1

spark-operator:
  enabled: true
  spark:
    jobNamespaces: [""]   # the release's namespace
  webhook:
    enable: false
