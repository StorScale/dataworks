# StorScale Platform's chart. The defaults run the whole platform on one
# kind node (deploy/kind/cluster.yaml); `storscale up --k8s` installs it so.

global:
  # The platform's one address, scheme://domain:port: people's browsers and
  # the services use it. The port is left out of it when it's the scheme's
  # own, so behind an ingress that ends TLS: scheme https, port 443.
  domain: storscale.localhost
  port: 8800
  scheme: http
  # Certificate authorities to trust besides the public ones: the one that
  # signs the platform's certificate, when it's private. The services call
  # the platform at its public address too (Keycloak's tokens name it), so
  # they must trust its certificate as people's browsers do. Give the CAs as
  # PEM (--set-file global.ca.certs=root-ca.pem), or name a ConfigMap in the
  # release's namespace that holds them (trust-manager's Bundles make these).
  ca:
    certs: ""
    configMap: ""
    key: ca.crt   # the ConfigMap's key

# The platform's brand, in its top bar's corner: StorScale's icon and name.
# A logo of your own takes their place, and the name becomes its text for
# screen readers. The logo is an SVG, PNG, JPEG, GIF or WebP image, base64:
#   base64 -w0 logo.svg > logo.b64; --set-file brand.logo=logo.b64
brand:
  name: StorScale
  logo: ""

# The images built from this repository (stack/*/Dockerfile and platformd's).
images:
  registry: ghcr.io/storscale
  tag: ""             # defaults to the chart's appVersion
  pullPolicy: IfNotPresent
  platformd: platformd
  tools: platform-tools
  airflow: platform-airflow
  superset: platform-superset
  jupyterhub: platform-jupyterhub
  notebook: platform-notebook
  opensearch: platform-opensearch
  semanticd: platform-semanticd
  catalogSync: platform-catalog-sync

# Everything else comes from its project's own image.
upstream:
  caddy: caddy:2.11.2-alpine
  keycloak: quay.io/keycloak/keycloak:26.8.0
  postgres: postgres:18-bookworm
  rangerAdmin: apache/ranger:2.9.0
  rangerDb: apache/ranger-db:2.9.0
  rangerSolr: apache/ranger-solr:2.9.0
  nessie: ghcr.io/projectnessie/nessie:0.108.8
  trino: trinodb/trino:483
  openmetadata: docker.getcollate.io/openmetadata/server:2.0.4
  prometheus: prom/prometheus:v3.13.4
  grafana: grafana/grafana:13.0.10
  bucketsd: ghcr.io/storscale/bucketsd:1.19.0

# The gateway: every address of the platform, as one Service. It listens on
# its own port over plain HTTP, whatever the platform's address is. The platform's
# names (domain, and catalog., access., s3. under it) must resolve to it from
# inside the cluster too, as from people's browsers: through the domain's DNS
# (an ingress or load balancer), or, on kind, through the cluster's DNS
# (deploy/kind/dns.sh), as Compose's network aliases do.
gateway:
  port: 8800
  # Proxies whose X-Forwarded-* headers the gateway passes on, so the tools
  # see the scheme people used: Caddy's trusted_proxies ranges, such as
  # "private_ranges" or CIDRs. Defaults to private_ranges with the ingress on.
  trustedProxies: ""
  service:
    type: NodePort
    nodePort: 30880   # kind maps the host's port 8800 here
  ingress:
    enabled: false
    className: ""
    annotations: {}   # such as cert-manager.io/cluster-issuer, for its certificate
    tls: []           # [{secretName, hosts}]; hosts default to the domain, and catalog., access., s3. under it

# Trino's HTTPS port, for JDBC and CLI clients outside the cluster.
trino:
  service:
    type: NodePort
    nodePort: 30443   # kind maps the host's port 8443 here
  memory: 1536Mi      # its heap is 80% of this

# How long a Deployment may take to become ready before Kubernetes calls its
# rollout failed (its default is 10 minutes). On a first install, services
# wait for the setup steps, and those for Keycloak, Buckets, Ranger and
# Trino: with every image still to pull, that takes longer.
progressDeadlineSeconds: 3600

# Every secret the platform needs, as `.env` holds them in Compose. Each one
# is generated on install and kept on upgrade; give a value here to choose it.
secrets: {}
#  LAKEHOUSE_USER_PASSWORD: ...

# The example people (alice, bob, carol) and their groups, from the realm.
examples:
  users: true

buckets:
  servers: 1
  volumesPerServer: 4
  storage: 10Gi
  storageClassName: ""   # the cluster's default
  # Each server keeps a copy of its audit log on its first drive, for 30
  # days or this much, whichever comes first (Buckets' default is 10G).
  auditLocalMax: 1G

storage:
  storageClassName: ""   # for the databases, Nessie, JupyterHub and the catalog
  postgres: 8Gi
  nessie: 2Gi
  jupyterhub: 1Gi
  opensearch: 4Gi

notebooks:
  memoryLimit: 1G
  storage: 1Gi

buckets-operator:
  enabled: true
  replicaCount: 1

spark-operator:
  enabled: true
  spark:
    jobNamespaces: [""]   # the release's namespace
  webhook:
    enable: false
