{{- /* Backups (backup.*): each night every database is dumped (the platform's
     Postgres, Nessie's catalog among them, and Ranger's), the Projects and
     Secrets exported, all packed and encrypted for backup.certificate, and
     kept in backup.bucket (stack/tools/backup.py). Off until there's a
     certificate: storscale backup keygen makes one, with the key a restore
     needs, which belongs somewhere else than this cluster. */}}
{{- if .Values.backup.certificate }}
apiVersion: v1
kind: Secret
metadata:
  name: storscale-backup-cert
  labels: {{- include "storscale.labels" . | nindent 4 }}
type: Opaque
stringData:
  cert.pem: {{ .Values.backup.certificate | quote }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: storscale-backup
  labels: {{- include "storscale.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels: {{- include "storscale.selector" (list .Release.Name "storscale-backup") | nindent 12 }}
        spec:
          enableServiceLinks: false
          serviceAccountName: storscale   # to read the Projects and Secrets
          restartPolicy: Never
          initContainers:
            {{- include "storscale.ca.init" . | nindent 12 }}
            # Every database, as pg_dump's custom format (pg_restore puts it back).
            - name: dump
              image: {{ .Values.upstream.postgres }}
              securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}   # the Postgres client alone: its image's postgres user
              command: ["bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  mkdir -p /backup/postgres
                  for db in $(psql -h postgres -U postgres -Atc "SELECT datname FROM pg_database WHERE NOT datistemplate AND datname <> 'postgres'"); do
                    echo "dumping $db"
                    pg_dump -h postgres -U postgres -Fc -f "/backup/postgres/$db.dump" "$db"
                  done
                  echo "dumping ranger"
                  PGPASSWORD="$RANGER_PASSWORD" pg_dump -h ranger-db -U postgres -Fc -f /backup/ranger.dump ranger
              env:
                - {name: PGPASSWORD, valueFrom: {secretKeyRef: {name: storscale-env, key: POSTGRES_ADMIN_PASSWORD}}}
                - {name: RANGER_PASSWORD, valueFrom: {secretKeyRef: {name: storscale-env, key: RANGER_PASSWORD}}}
              volumeMounts:
                - {name: backup, mountPath: /backup}
              resources:
                requests: {cpu: 50m, memory: 64Mi}
          containers:
            - name: backup
              image: {{ include "storscale.image" (list . "tools") }}
              securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
              imagePullPolicy: {{ .Values.images.pullPolicy }}
              command: ["python", "-u", "/tools/backup.py", "run"]
              env:
                {{- include "storscale.backup.env" . | nindent 16 }}
                {{- include "storscale.ca.env" . | nindent 16 }}
              volumeMounts:
                - {name: backup, mountPath: /backup}
                - {name: files-tools, mountPath: /tools}
                - {name: cert, mountPath: /backup-cert, readOnly: true}
                {{- include "storscale.ca.mount" . | nindent 16 }}
              {{- include "storscale.resources" (list "50m" "128Mi" "512Mi") | nindent 14 }}
          volumes:
            - {name: backup, emptyDir: {}}
            - {name: cert, secret: {secretName: storscale-backup-cert}}
            {{- include "storscale.filesVolume" (list . "tools" "tools") | nindent 12 }}
            {{- include "storscale.ca.volumes" . | nindent 12 }}
{{- if .Values.backup.data.enabled }}
{{- if and (not .Values.backup.s3.endpoint) (not .Values.backup.data.allowInternal) }}
{{- fail "backup.data copies the data off the cluster: give backup.s3.endpoint (an S3 elsewhere), or backup.data.allowInternal for a test" }}
{{- end }}
---
# The data itself (backup.data): every bucket but the backups' copied to
# backup.s3 (under data/<bucket>), what changed since the last copy. Never
# deleted there: a source emptied by mistake can't empty its copy.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: storscale-backup-data
  labels: {{- include "storscale.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.data.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels: {{- include "storscale.selector" (list .Release.Name "storscale-backup-data") | nindent 12 }}
        spec:
          enableServiceLinks: false
          automountServiceAccountToken: false
          restartPolicy: Never
          initContainers:
            {{- include "storscale.ca.init" . | nindent 12 }}
          containers:
            - name: data
              image: {{ include "storscale.image" (list . "tools") }}
              securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
              imagePullPolicy: {{ .Values.images.pullPolicy }}
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  mc alias set src http://buckets:9000 "$BUCKETS_ROOT_USER" "$BUCKETS_ROOT_PASSWORD" >/dev/null
                  mc alias set dst "$BACKUP_ENDPOINT" "$BACKUP_ACCESS_KEY" "$BACKUP_SECRET_KEY" >/dev/null
                  for b in $(mc ls src | awk '{print $NF}' | tr -d /); do
                    [ "$b" = "$BACKUP_BUCKET" ] && continue
                    echo "data: $b"
                    # An object read short now and then fails a copy: the mirror is
                    # incremental, so again copies only what's missing.
                    n=1
                    until mc mirror --overwrite --quiet "src/$b" "dst/$BACKUP_BUCKET/data/$b"; do
                      [ "$n" -ge 3 ] && exit 1
                      n=$((n + 1)); echo "data: $b again ($n of 3)"; sleep 10
                    done
                  done
                  echo "data: copied"
              env:
                {{- include "storscale.backup.env" . | nindent 16 }}
                - {name: BUCKETS_ROOT_USER, valueFrom: {secretKeyRef: {name: storscale-env, key: BUCKETS_ROOT_USER}}}
                - {name: BUCKETS_ROOT_PASSWORD, valueFrom: {secretKeyRef: {name: storscale-env, key: BUCKETS_ROOT_PASSWORD}}}
                {{- include "storscale.ca.env" . | nindent 16 }}
              {{- with include "storscale.ca.mount" . }}
              volumeMounts: {{- . | nindent 16 }}
              {{- end }}
              {{- include "storscale.resources" (list "50m" "128Mi" "512Mi") | nindent 14 }}
          {{- with include "storscale.ca.volumes" . }}
          volumes: {{- . | nindent 12 }}
          {{- end }}
{{- end }}
{{- end }}
