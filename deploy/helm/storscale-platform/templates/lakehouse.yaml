# The lakehouse's tables: Nessie (the Iceberg catalog) and Trino. Nessie
# keeps the catalog in the platform's Postgres (nessie-db); nessie-data held
# it in RocksDB before 0.9.0, and keeps those files, moved aside.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nessie-data
  labels: {{- include "storscale.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.storage.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources: {requests: {storage: {{ .Values.storage.nessie }}}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nessie
  labels: {{- include "storscale.labels" . | nindent 4 }}
spec:
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  selector:
    matchLabels: {{- include "storscale.selector" (list .Release.Name "nessie") | nindent 6 }}
  strategy: {type: Recreate}
  template:
    metadata:
      labels: {{- include "storscale.selector" (list .Release.Name "nessie") | nindent 8 }}
    spec:
      enableServiceLinks: false
      serviceAccountName: storscale
      securityContext: {fsGroup: 185}
      initContainers:
        {{- include "storscale.wait" (list . "setup" (list "job" "setup")) | nindent 8 }}
        # Nessie's database on the platform's Postgres, made if it's missing
        # (an install from before 0.9.0 has none), as Postgres' admin.
        - name: database
          image: {{ .Values.upstream.postgres }}
          command: ["bash", "-c"]
          args:
            - |
              until pg_isready -h nessie-db -U postgres -q; do sleep 2; done
              psql -h nessie-db -U postgres -v ON_ERROR_STOP=1 -v pw="$NESSIE_DB_PASSWORD" <<'SQL'
              SELECT 'CREATE ROLE nessie LOGIN' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'nessie') \gexec
              ALTER ROLE nessie PASSWORD :'pw';
              SELECT 'CREATE DATABASE nessie OWNER nessie' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'nessie') \gexec
              REVOKE CONNECT, TEMPORARY ON DATABASE nessie FROM PUBLIC;
              SQL
          env:
            - {name: PGPASSWORD, valueFrom: {secretKeyRef: {name: storscale-env, key: POSTGRES_ADMIN_PASSWORD}}}
            - {name: NESSIE_DB_PASSWORD, valueFrom: {secretKeyRef: {name: storscale-env, key: NESSIE_DB_PASSWORD}}}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
        # Before 0.9.0 the catalog was in RocksDB, on nessie-data: moved into
        # Postgres once, here, while Nessie is stopped (Recreate), then the
        # RocksDB files are renamed, never read again (kept for a rollback).
        - name: move
          image: {{ .Values.upstream.nessieAdmin }}
          command: ["bash", "-c"]
          args:
            - |
              if [ ! -d /home/nessie/catalog ]; then echo "nessie-move: no RocksDB catalog to move"; exit 0; fi
              set -e
              echo "nessie-move: exporting the RocksDB catalog"
              java -Dnessie.version.store.type=ROCKSDB -Dnessie.version.store.persist.rocks.database-path=/home/nessie/catalog \
                -jar /deployments/quarkus-run.jar export --path /home/nessie/rocksdb-export.zip
              echo "nessie-move: importing it into Postgres"
              java -jar /deployments/quarkus-run.jar import --path /home/nessie/rocksdb-export.zip --erase-before-import
              mv /home/nessie/catalog /home/nessie/catalog-rocksdb-moved
              echo "nessie-move: done; the RocksDB files are kept in catalog-rocksdb-moved"
          env:
            {{- include "storscale.nessieDb" . | nindent 12 }}
            - {name: JAVA_TOOL_OPTIONS, value: "-Xmx384m"}
          volumeMounts:
            - {name: data, mountPath: /home/nessie}
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 640Mi}
      containers:
        - name: nessie
          image: {{ .Values.upstream.nessie }}
          env:
            - {name: JAVA_OPTS_APPEND, value: "-Xms64m -Xmx256m"}
            {{- include "storscale.nessieDb" . | nindent 12 }}
            - {name: nessie.catalog.default-warehouse, value: warehouse}
            - {name: nessie.catalog.warehouses.warehouse.location, value: "s3://warehouse/"}
            - {name: nessie.catalog.service.s3.default-options.endpoint, value: "http://buckets:9000/"}
            - {name: nessie.catalog.service.s3.default-options.region, value: us-east-1}
            - {name: nessie.catalog.service.s3.default-options.path-style-access, value: "true"}
            - {name: nessie.catalog.service.s3.default-options.access-key, value: "urn:nessie-secret:quarkus:nessie.catalog.secrets.access-key"}
            - {name: nessie.catalog.secrets.access-key.name, valueFrom: {secretKeyRef: {name: storscale-env, key: NESSIE_S3_ACCESS_KEY}}}
            - {name: nessie.catalog.secrets.access-key.secret, valueFrom: {secretKeyRef: {name: storscale-env, key: NESSIE_S3_SECRET_KEY}}}
          ports:
            - {name: http, containerPort: 19120}
            - {name: management, containerPort: 9000}
          readinessProbe:
            httpGet: {path: /q/health/ready, port: management}
            periodSeconds: 5
            failureThreshold: 60
          {{- include "storscale.resources" (list "50m" "320Mi" "512Mi") | nindent 10 }}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: nessie-data}}
        {{- include "storscale.filesVolume" (list . "tools" "tools") | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: nessie
  labels: {{- include "storscale.labels" . | nindent 4 }}
spec:
  selector: {{- include "storscale.selector" (list .Release.Name "nessie") | nindent 4 }}
  ports:
    - {name: http, port: 19120, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino
  labels: {{- include "storscale.labels" . | nindent 4 }}
spec:
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  selector:
    matchLabels: {{- include "storscale.selector" (list .Release.Name "trino") | nindent 6 }}
  strategy: {type: Recreate}
  template:
    metadata:
      labels: {{- include "storscale.selector" (list .Release.Name "trino") | nindent 8 }}
      annotations:
        checksum/config: {{ include "storscale.filesConfigMap" (list . "trino" "trino") | sha256sum }}
    spec:
      enableServiceLinks: false
      serviceAccountName: storscale
      initContainers:
        {{- include "storscale.ca.init" . | nindent 8 }}
        {{- include "storscale.wait" (list . "setup" (list "job" "setup")) | nindent 8 }}
        {{- include "storscale.wait" (list . "nessie" (list "url" "http://nessie:19120/api/v2/config")) | nindent 8 }}
        # Its limits' database and user (resource-groups.properties), if they're
        # missing: as Postgres' admin, who is in this step alone.
        - name: database
          image: {{ .Values.upstream.postgres }}
          command: ["bash", "-c"]
          args:
            - |
              until pg_isready -h trino-db -U postgres -q; do sleep 2; done
              psql -h trino-db -U postgres -v ON_ERROR_STOP=1 -v pw="$TRINO_DB_PASSWORD" <<'SQL'
              SELECT 'CREATE ROLE trino LOGIN' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'trino') \gexec
              ALTER ROLE trino PASSWORD :'pw';
              SELECT 'CREATE DATABASE trino OWNER trino' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'trino') \gexec
              REVOKE CONNECT, TEMPORARY ON DATABASE trino FROM PUBLIC;
              SQL
          env:
            - {name: PGPASSWORD, valueFrom: {secretKeyRef: {name: storscale-env, key: POSTGRES_ADMIN_PASSWORD}}}
            - {name: TRINO_DB_PASSWORD, valueFrom: {secretKeyRef: {name: storscale-env, key: TRINO_DB_PASSWORD}}}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
        # Trino's password file (bcrypt): Superset, the catalog and platformd's table maintenance sign in to Trino with passwords.
        - name: passwords
          image: {{ include "storscale.image" (list . "tools") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - htpasswd -B -C 10 -b -c /auth/password.db superset "$SUPERSET_TRINO_PASSWORD" &&
              htpasswd -B -C 10 -b /auth/password.db openmetadata "$OPENMETADATA_TRINO_PASSWORD" &&
              htpasswd -B -C 10 -b /auth/password.db maintenance "$MAINTENANCE_TRINO_PASSWORD" && chmod 644 /auth/password.db
          {{- include "storscale.envFrom" . | nindent 10 }}
          volumeMounts:
            - {name: auth, mountPath: /auth}
      containers:
        - name: trino
          image: {{ .Values.upstream.trino }}
          {{- include "storscale.envFrom" . | nindent 10 }}
          {{- /* It fetches Keycloak's keys at the public address. */}}
          {{- with include "storscale.ca.env" . }}
          env: {{- . | nindent 12 }}
          {{- end }}
          ports:
            - {name: http, containerPort: 8080}
            - {name: https, containerPort: 8443}
          readinessProbe:
            exec: {command: ["sh", "-c", "curl -sf http://localhost:8080/v1/info | grep -q '\"starting\":false'"]}
            periodSeconds: 5
            failureThreshold: 60
          volumeMounts:
            {{- range $f := list "config.properties" "password-authenticator.properties" "access-control.properties" "resource-groups.properties" "ranger-trino-security.xml" "ranger-trino-audit.xml" }}
            - {name: files-trino, mountPath: /etc/trino/{{ $f }}, subPath: {{ $f }}}
            {{- end }}
            - {name: files-trino, mountPath: /etc/trino/catalog, subPath: catalog}
            - {name: tls, mountPath: /etc/trino/tls}
            - {name: auth, mountPath: /etc/trino/auth}
            {{- include "storscale.ca.mount" . | nindent 12 }}
          resources:
            requests: {cpu: 250m, memory: {{ .Values.trino.memory }}}
            limits: {memory: {{ .Values.trino.memory }}}
      volumes:
        {{- include "storscale.filesVolume" (list . "trino" "trino") | nindent 8 }}
        {{- include "storscale.filesVolume" (list . "tools" "tools") | nindent 8 }}
        - {name: tls, secret: {secretName: trino-tls}}
        - {name: auth, emptyDir: {}}
        {{- include "storscale.ca.volumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: trino
  labels: {{- include "storscale.labels" . | nindent 4 }}
spec:
  selector: {{- include "storscale.selector" (list .Release.Name "trino") | nindent 4 }}
  ports:
    - {name: http, port: 8080, targetPort: http}
    - {name: https, port: 8443, targetPort: https}
---
# Trino's HTTPS port, for JDBC and CLI clients outside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: trino-external
  labels: {{- include "storscale.labels" . | nindent 4 }}
spec:
  type: {{ .Values.trino.service.type }}
  selector: {{- include "storscale.selector" (list .Release.Name "trino") | nindent 4 }}
  ports:
    - name: https
      port: 8443
      targetPort: https
      {{- if and (eq .Values.trino.service.type "NodePort") .Values.trino.service.nodePort }}
      nodePort: {{ .Values.trino.service.nodePort }}
      {{- end }}
---
# Nessie's GC: the tables' history older than maintenance.history.keep, and
# files no branch or tag needs, deleted from the warehouse, as Nessie's own
# Buckets account. A run that fails is a failed Job: the Health page's.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nessie-gc
  labels: {{- include "storscale.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.maintenance.history.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels: {{- include "storscale.selector" (list .Release.Name "nessie-gc") | nindent 12 }}
        spec:
          enableServiceLinks: false
          restartPolicy: Never
          initContainers:
            {{- include "storscale.wait" (list . "nessie" (list "url" "http://nessie:19120/api/v2/config")) | nindent 12 }}
          containers:
            - name: gc
              image: {{ .Values.upstream.nessieGc }}
              args: ["gc", "--uri", "http://nessie:19120/api/v2", "--inmemory",
                     "--default-cutoff", {{ .Values.maintenance.history.keep | quote }},
                     "--iceberg", "s3.endpoint=http://buckets:9000/,s3.path-style-access=true"]
              env:
                - {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: storscale-env, key: NESSIE_S3_ACCESS_KEY}}}
                - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: storscale-env, key: NESSIE_S3_SECRET_KEY}}}
                - {name: AWS_REGION, value: us-east-1}
                - {name: JAVA_TOOL_OPTIONS, value: "-Xmx384m"}
              {{- include "storscale.resources" (list "100m" "512Mi" "640Mi") | nindent 14 }}
          volumes:
            {{- include "storscale.filesVolume" (list . "tools" "tools") | nindent 12 }}
