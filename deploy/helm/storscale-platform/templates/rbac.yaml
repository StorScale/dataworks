# The platform's own pods: setup steps write a few Secrets (the catalog's bot
# token, Prometheus' Buckets token) and mark themselves finished; services
# wait for them; platformd and the operator keep the projects (Project
# resources), and the operator each project's own Airflow. Nothing outside
# the release's namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: storscale
  labels: {{- include "storscale.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: storscale
  labels: {{- include "storscale.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets, configmaps]
    verbs: [get, list, create, update]
  # ... and removes a project's Airflow's keys with it.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [delete]
  # The setup step starts Buckets' pods afresh if they came up before Keycloak.
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, deletecollection]
  # platformd's Health page: why a service's pods aren't running.
  - apiGroups: [""]
    resources: [events]
    verbs: [list]
  # The operator runs each project's own Airflow (a Deployment and a Service).
  - apiGroups: [""]
    resources: [services]
    verbs: [get, create, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, create, patch, delete]
  - apiGroups: [platform.storscale.io]
    resources: [projects]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [platform.storscale.io]
    resources: [projects/status, projects/finalizers]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: storscale
  labels: {{- include "storscale.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: storscale}
subjects:
  - {kind: ServiceAccount, name: storscale, namespace: {{ .Release.Namespace }}}
