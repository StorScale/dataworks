# Airflow: pipelines, at the platform's /pipelines/. The API server and UI,
# the scheduler (LocalExecutor: it runs the tasks too) and the DAG processor,
# after airflow-init (its database, the platform's account, and the
# pipelines' Keycloak client).
#
# Airflow runs every project's DAG code, so it gets the keys it needs and no
# others: storscale-env's Airflow keys by name, not all of it (the platform's
# admin secrets); Trino's certificate, not its key; and a service account that
# may only read whether the setup steps are done.
# storscale.airflow.common: (list $ part), part init, api-server, scheduler or dag-processor.
{{- define "storscale.airflow.common" -}}
{{- $root := index . 0 }}{{ $part := index . 1 -}}
image: {{ include "storscale.image" (list $root "airflow") }}
imagePullPolicy: {{ $root.Values.images.pullPolicy }}
securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 50000, runAsGroup: 50000, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
envFrom:
  - configMapRef: {name: storscale-config}
env:
  {{- $keys := list "AIRFLOW_DB_PASSWORD" "AIRFLOW_FERNET_KEY" "AIRFLOW_SECRET_KEY" "AIRFLOW_JWT_SECRET" }}
  {{- if eq $part "init" }}{{ $keys = concat $keys (list "AIRFLOW_PLATFORM_PASSWORD" "AIRFLOW_PIPELINES_SECRET") }}{{ end }}
  {{- if eq $part "api-server" }}{{ $keys = append $keys "AIRFLOW_OAUTH_SECRET" }}{{ end }}
  {{- range $keys }}
  - {name: {{ . }}, valueFrom: {secretKeyRef: {name: storscale-env, key: {{ . }}}}}
  {{- end }}
  - {name: AIRFLOW__CORE__EXECUTOR, value: LocalExecutor}
  # The scheduler serves its tasks' logs (port 8793) at the name it gives
  # them; a pod's own name doesn't resolve in the cluster's DNS, its IP does.
  - {name: AIRFLOW__CORE__HOSTNAME_CALLABLE, value: airflow.utils.net.get_host_ip_address}
  - {name: AIRFLOW__CORE__PARALLELISM, value: "4"}
  - {name: AIRFLOW__CORE__AUTH_MANAGER, value: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager}
  - {name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN, value: "postgresql+psycopg2://airflow:$(AIRFLOW_DB_PASSWORD)@airflow-db:5432/airflow"}
  - {name: AIRFLOW__CORE__FERNET_KEY, value: "$(AIRFLOW_FERNET_KEY)"}
  - {name: AIRFLOW__API__SECRET_KEY, value: "$(AIRFLOW_SECRET_KEY)"}
  - {name: AIRFLOW__API_AUTH__JWT_SECRET, value: "$(AIRFLOW_JWT_SECRET)"}
  - {name: AIRFLOW__API__BASE_URL, value: "{{ include "storscale.url" $root }}/pipelines"}
  - {name: AIRFLOW__API__PORT, value: "8090"}
  # The API server (--proxy-headers) trusts X-Forwarded-* only from these;
  # uvicorn's default, 127.0.0.1, leaves out the gateway.
  - {name: FORWARDED_ALLOW_IPS, value: "*"}
  - {name: AIRFLOW__CORE__EXECUTION_API_SERVER_URL, value: "http://airflow:8090/pipelines/execution/"}
  - {name: AIRFLOW__CORE__LOAD_EXAMPLES, value: "False"}
  - {name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION, value: "False"}
  - {name: AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL, value: "10"}
  - {name: STORSCALE_REVISION, value: {{ $root.Release.Revision | quote }}}
  {{- include "storscale.ca.env" $root | nindent 2 }}
volumeMounts:
  - {name: files-airflow, mountPath: /opt/airflow/webserver_config.py, subPath: webserver_config.py}
  - {name: files-airflow, mountPath: /opt/airflow/dags, subPath: dags}
  - {name: files-tools, mountPath: /tools}
  - {name: tls, mountPath: /tls}
  - {name: catalog, mountPath: /catalog, readOnly: true}   # the catalog's token, for reporting lineage
  {{- if $root.Values.pipelines.gitKnownHosts }}
  - {name: git-known-hosts, mountPath: /etc/storscale/git, readOnly: true}   # the git hosts' SSH keys
  {{- end }}
  {{- include "storscale.ca.mount" $root | nindent 2 }}
{{- end }}
{{- define "storscale.airflow.volumes" -}}
{{- include "storscale.filesVolume" (list . "airflow" "airflow") }}
{{- include "storscale.filesVolume" (list . "tools" "tools") | nindent 0 }}
- {name: tls, secret: {secretName: trino-tls, items: [{key: cert.pem, path: cert.pem}]}}
- {name: catalog, secret: {secretName: catalog-token, optional: true}}
{{- if .Values.pipelines.gitKnownHosts }}
- {name: git-known-hosts, configMap: {name: storscale-git-known-hosts}}
{{- end }}
{{- include "storscale.ca.volumes" . | nindent 0 }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-init-{{ .Release.Revision }}
  labels: {{- include "storscale.labels" . | nindent 4 }}
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {{- include "storscale.selector" (list .Release.Name "airflow-init") | nindent 8 }}
    spec:
      enableServiceLinks: false
      serviceAccountName: storscale
      restartPolicy: Never   # retried, in a new pod, if its database isn't ready yet
      initContainers:
        {{- include "storscale.ca.init" . | nindent 8 }}
        {{- include "storscale.wait" (list . "db" (list "tcp" "airflow-db:5432")) | nindent 8 }}
      containers:
        - name: init
          {{- include "storscale.airflow.common" (list . "init") | nindent 10 }}
          command: ["bash", "-c"]
          args:
            - |
              airflow db migrate && airflow fab-db migrate &&
              airflow connections delete keycloak_pipelines >/dev/null 2>&1;
              # The platform's own account, for the pipelines pages. (create exits 0
              # when the user exists, so the password is set again either way.)
              airflow users create --username storscale-platform --password "$AIRFLOW_PLATFORM_PASSWORD" \
                --firstname StorScale --lastname Platform --email platform@{{ .Values.global.domain }} --role Op >/dev/null 2>&1;
              airflow users reset-password --username storscale-platform --password "$AIRFLOW_PLATFORM_PASSWORD" >/dev/null &&
              airflow connections add keycloak_pipelines --conn-type http \
                --conn-host {{ .Values.global.domain }}{{ if include "storscale.portSuffix" . }} --conn-port {{ .Values.global.port }}{{ end }} --conn-schema sso \
                --conn-extra '{"scheme": "{{ .Values.global.scheme }}"}' \
                --conn-login airflow-pipelines --conn-password "$AIRFLOW_PIPELINES_SECRET" \
                --conn-description "The pipelines' Keycloak service account (client credentials)" &&
              python /tools/k8s.py done airflow-init
          {{- include "storscale.resources" (list "100m" "384Mi" "1Gi") | nindent 10 }}
      volumes:
        {{- include "storscale.airflow.volumes" . | nindent 8 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow
  labels: {{- include "storscale.labels" . | nindent 4 }}
spec:
  replicas: {{ include "storscale.replicas" (list . "airflow") }}
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  selector:
    matchLabels: {{- include "storscale.selector" (list .Release.Name "airflow") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "storscale.selector" (list .Release.Name "airflow") | nindent 8 }}
      annotations:
        checksum/config: {{ include "storscale.filesConfigMap" (list . "airflow" "airflow") | sha256sum }}
    spec:
      {{- include "storscale.spread" (list . "airflow") | nindent 6 }}
      enableServiceLinks: false
      serviceAccountName: storscale-airflow
      initContainers:
        {{- include "storscale.ca.init" . | nindent 8 }}
        {{- include "storscale.wait" (list . "setup" (list "job" "airflow-init" "setup-trino")) | nindent 8 }}
        {{- include "storscale.wait" (list . "keycloak" (list "url" "http://keycloak:9000/health/ready")) | nindent 8 }}
      containers:
        - name: api-server
          {{- include "storscale.airflow.common" (list . "api-server") | nindent 10 }}
          args: ["api-server", "--proxy-headers"]   # the scheme people used, from the gateway
          ports:
            - {name: http, containerPort: 8090}
          readinessProbe:
            httpGet: {path: /pipelines/api/v2/monitor/health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          {{- include "storscale.resources" (list "100m" "384Mi" "1Gi") | nindent 10 }}
      volumes:
        {{- include "storscale.airflow.volumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: airflow
  labels: {{- include "storscale.labels" . | nindent 4 }}
spec:
  selector: {{- include "storscale.selector" (list .Release.Name "airflow") | nindent 4 }}
  ports:
    - {name: http, port: 8090, targetPort: http}
{{- range $part := list "scheduler" "dag-processor" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-{{ $part }}
  labels: {{- include "storscale.labels" $ | nindent 4 }}
spec:
  progressDeadlineSeconds: {{ $.Values.progressDeadlineSeconds }}
  selector:
    matchLabels: {{- include "storscale.selector" (list $.Release.Name (printf "airflow-%s" $part)) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "storscale.selector" (list $.Release.Name (printf "airflow-%s" $part)) | nindent 8 }}
      annotations:
        checksum/config: {{ include "storscale.filesConfigMap" (list $ "airflow" "airflow") | sha256sum }}
    spec:
      enableServiceLinks: false
      serviceAccountName: storscale-airflow
      initContainers:
        {{- include "storscale.ca.init" $ | nindent 8 }}
        {{- include "storscale.wait" (list $ "airflow" (list "url" "http://airflow:8090/pipelines/api/v2/monitor/health")) | nindent 8 }}
      containers:
        - name: {{ $part }}
          {{- include "storscale.airflow.common" (list $ $part) | nindent 10 }}
          # Through the wrapper that gives it the DAG bundles: the platform's own,
          # and each project's pipelines repo (from the operator).
          args: ["python", "/tools/airflow_bundles.py", "airflow", {{ $part | quote }}]
          {{- if eq $part "scheduler" }}
          {{- include "storscale.resources" (list "100m" "384Mi" "1536Mi") | nindent 10 }}
          {{- else }}
          {{- include "storscale.resources" (list "50m" "256Mi" "768Mi") | nindent 10 }}
          {{- end }}
      volumes:
        {{- include "storscale.airflow.volumes" $ | nindent 8 }}
{{- end }}
---
# Airflow's own service account: its pods wait for the setup steps, and
# nothing else (airflow-init, which runs no DAG code, marks itself done as
# the platform's own steps do).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: storscale-airflow
  labels: {{- include "storscale.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: storscale-airflow
  labels: {{- include "storscale.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [storscale-setup-done]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: storscale-airflow
  labels: {{- include "storscale.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: storscale-airflow}
subjects:
  - {kind: ServiceAccount, name: storscale-airflow, namespace: {{ .Release.Namespace }}}
