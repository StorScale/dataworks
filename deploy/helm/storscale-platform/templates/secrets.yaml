{{/* storscale-env: what .env holds in Compose. Each value is the one given in
     values (secrets.<KEY>), else the one already in the cluster, else a new
     one: generated on install, kept on upgrade. */}}
{{- $existing := dict }}
{{- with (lookup "v1" "Secret" .Release.Namespace "storscale-env") }}{{ $existing = .data }}{{ end }}
{{- $names := dict
  "BUCKETS_ROOT_USER" "storscale-root"
  "PLATFORM_STORE_ACCESS_KEY" "platform-store"
  "TRINO_S3_ACCESS_KEY" "trino"
  "NESSIE_S3_ACCESS_KEY" "nessie"
  "BACKUP_S3_ACCESS_KEY" "backup"
  "COPY_S3_ACCESS_KEY" "copy"
  "PROMETHEUS_USER" "prometheus" }}
{{- $random := list
  "PLATFORM_OAUTH_SECRET" "PLATFORM_STORE_SECRET_KEY" "OPERATOR_CLIENT_SECRET"
  "BUCKETS_ROOT_PASSWORD" "TRINO_S3_SECRET_KEY" "NESSIE_S3_SECRET_KEY"
  "KEYCLOAK_ADMIN_PASSWORD" "KEYCLOAK_DB_PASSWORD" "NESSIE_DB_PASSWORD" "LAKEHOUSE_USER_PASSWORD" "RANGER_PASSWORD" "RANGER_PLUGIN_PASSWORD"
  "TRINO_SHARED_SECRET" "TRINO_DB_PASSWORD" "JUPYTERHUB_OAUTH_SECRET"
  "SUPERSET_OAUTH_SECRET" "SUPERSET_SECRET_KEY" "SUPERSET_DB_PASSWORD" "SUPERSET_TRINO_PASSWORD"
  "AIRFLOW_OAUTH_SECRET" "AIRFLOW_PIPELINES_SECRET" "AIRFLOW_DB_PASSWORD" "AIRFLOW_SECRET_KEY"
  "AIRFLOW_JWT_SECRET" "AIRFLOW_PLATFORM_PASSWORD"
  "OPENMETADATA_OAUTH_SECRET" "OPENMETADATA_DB_PASSWORD" "OPENMETADATA_TRINO_PASSWORD"
  "MAINTENANCE_TRINO_PASSWORD" "OPERATOR_TRINO_PASSWORD" "COPY_S3_SECRET_KEY" "BACKUP_S3_SECRET_KEY" "PROMETHEUS_SECRET" "GRAFANA_ADMIN_PASSWORD" "GRAFANA_OAUTH_SECRET" "POSTGRES_ADMIN_PASSWORD" "LLM_MASTER_KEY" }}
{{- /* 32 random bytes, base64 (URL-safe for Fernet keys) */}}
{{- $keys := list "AIRFLOW_FERNET_KEY" "OPENMETADATA_FERNET_KEY" "JUPYTERHUB_CRYPT_KEY" }}
{{- /* Each key's value, base64 as a Secret holds it. */}}
{{- $env := dict }}
{{- range $k, $v := $names }}
{{- $_ := set $env $k (index $.Values.secrets $k | default $v | b64enc) }}
{{- end }}
{{- range $k := $random }}
{{- if index $.Values.secrets $k }}{{ $_ := set $env $k (index $.Values.secrets $k | b64enc) }}
{{- else }}{{ $_ := set $env $k (index $existing $k | default (randAlphaNum 32 | b64enc)) }}{{ end }}
{{- end }}
{{- range $k := $keys }}
{{- if index $.Values.secrets $k }}{{ $_ := set $env $k (index $.Values.secrets $k | b64enc) }}
{{- else }}{{ $_ := set $env $k (index $existing $k | default (randBytes 32 | replace "+" "-" | replace "/" "_" | b64enc)) }}{{ end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: storscale-env
  labels: {{- include "storscale.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # uninstalling keeps the data's passwords
type: Opaque
data:
{{- range $k, $v := $env }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
---
# Buckets' root account, as its operator wants it (spec.credsSecret).
apiVersion: v1
kind: Secret
metadata:
  name: buckets-root
  labels: {{- include "storscale.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  rootUser: {{ $env.BUCKETS_ROOT_USER | quote }}
  rootPassword: {{ $env.BUCKETS_ROOT_PASSWORD | quote }}
---
{{/* Trino's certificate (Trino takes tokens only over HTTPS), and the realm's
     signing key: made once, kept. */}}
{{- $tls := lookup "v1" "Secret" .Release.Namespace "trino-tls" }}
apiVersion: v1
kind: Secret
metadata:
  name: trino-tls
  labels: {{- include "storscale.labels" . | nindent 4 }}
type: Opaque
data:
{{- if $tls }}
{{- toYaml $tls.data | nindent 2 }}
{{- else }}
{{- $c := genSelfSignedCert "trino" nil (list "trino" "localhost" (printf "trino.%s.svc" .Release.Namespace)) 3650 }}
  cert.pem: {{ $c.Cert | b64enc }}
  key.pem: {{ $c.Key | b64enc }}
  trino.pem: {{ printf "%s%s" $c.Key $c.Cert | b64enc }}
{{- end }}
---
{{/* The projects' sources' connections, which Trino reads (mounted at
     /etc/trino/sources): the platform operator writes them. Made here empty,
     so Trino's pods start with it; its data is never the chart's, so an
     upgrade leaves it. */}}
apiVersion: v1
kind: Secret
metadata:
  name: trino-sources
  labels: {{- include "storscale.labels" . | nindent 4 }}
type: Opaque
---
{{- $kc := lookup "v1" "Secret" .Release.Namespace "keycloak-keys" }}
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-keys
  labels: {{- include "storscale.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # tokens stay valid across reinstalls
type: Opaque
data:
{{- if $kc }}
{{- toYaml $kc.data | nindent 2 }}
{{- else }}
{{- $c := genSelfSignedCert "lakehouse" nil nil 3650 }}
  cert.pem: {{ $c.Cert | b64enc }}
  key.pem: {{ $c.Key | b64enc }}
{{- end }}
