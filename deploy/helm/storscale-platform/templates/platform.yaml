# The platform: its web app and API (platformd), the operator that applies
# projects, and the semantic layer (semanticd, with the MCP server for agents).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platformd
  labels: {{- include "storscale.labels" . | nindent 4 }}
spec:
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  selector:
    matchLabels: {{- include "storscale.selector" (list .Release.Name "platformd") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "storscale.selector" (list .Release.Name "platformd") | nindent 8 }}
      annotations:
        checksum/brand: {{ list .Values.brand.name .Values.brand.title .Values.brand.logo .Values.brand.icon | toJson | sha256sum }}
    spec:
      enableServiceLinks: false
      serviceAccountName: storscale
      initContainers:
        {{- include "storscale.ca.init" . | nindent 8 }}
        {{- include "storscale.wait" (list . "keycloak" (list "url" "http://keycloak:9000/health/ready")) | nindent 8 }}
      containers:
        - name: platformd
          image: {{ include "storscale.image" (list . "platformd") }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - {name: PLATFORM_URL, value: {{ include "storscale.url" . | quote }}}
            - {name: KEYCLOAK_URL, value: "{{ include "storscale.url" . }}/sso"}
            - {name: KEYCLOAK_DIRECT_URL, value: "http://keycloak:8080/sso"}
            - {name: OIDC_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: storscale-env, key: PLATFORM_OAUTH_SECRET}}}
            # Projects are Project resources, with a copy in the bucket for the services that read them there.
            - {name: PROJECT_STORE, value: kubernetes}
            - {name: STORE_URL, value: "http://buckets:9000"}
            - {name: STORE_ACCESS_KEY, valueFrom: {secretKeyRef: {name: storscale-env, key: PLATFORM_STORE_ACCESS_KEY}}}
            - {name: STORE_SECRET_KEY, valueFrom: {secretKeyRef: {name: storscale-env, key: PLATFORM_STORE_SECRET_KEY}}}
            - {name: CATALOG_URL, value: "http://openmetadata:8585"}
            - {name: SEMANTIC_URL, value: "http://semanticd:8000"}
            - {name: AIRFLOW_URL, value: "http://airflow:8090/pipelines"}
            - {name: AIRFLOW_USER, value: storscale-platform}
            - {name: AIRFLOW_PASSWORD, valueFrom: {secretKeyRef: {name: storscale-env, key: AIRFLOW_PLATFORM_PASSWORD}}}
            # The Health page, and alerts (where the platform's Secret storscale-alerts says).
            - {name: HEALTH, value: "on"}
            - {name: GATEWAY_HEALTH_URL, value: "http://gateway:{{ .Values.gateway.port }}/healthz"}
            # Project alerts: when a project's tables last changed (its freshness targets).
            - {name: NESSIE_URL, value: "http://nessie:19120"}
            # A project with a repo has an Airflow of its own (project-<name>-airflow).
            - {name: PROJECT_AIRFLOWS, value: "true"}
            # Table maintenance, each night (maintenance.*), as Trino's maintenance account.
            - {name: TRINO_URL, value: "https://trino:8443"}
            - {name: TRINO_CA, value: /trino-cert/cert.pem}
            - {name: MAINTENANCE_TRINO_PASSWORD, valueFrom: {secretKeyRef: {name: storscale-env, key: MAINTENANCE_TRINO_PASSWORD}}}
            - {name: MAINTENANCE_AT, value: {{ .Values.maintenance.at | quote }}}
            - {name: MAINTENANCE_KEEP_HISTORY, value: {{ .Values.maintenance.history.keep | quote }}}
            # The audit log, beside Ranger's in its Solr (audit.*).
            - {name: AUDIT_URL, value: "http://ranger-solr:8983/solr/ranger_audits"}
            - {name: AUDIT_KEEP, value: {{ .Values.audit.keep | quote }}}
            - {name: BRAND_NAME, value: {{ .Values.brand.name | quote }}}
            {{- with .Values.brand.title }}
            - {name: BRAND_TITLE, value: {{ . | quote }}}
            {{- end }}
            {{- if .Values.brand.logo }}
            - {name: BRAND_LOGO, value: /etc/storscale/brand/logo}
            {{- end }}
            {{- if .Values.brand.icon }}
            - {name: BRAND_ICON, value: /etc/storscale/brand/icon}
            {{- end }}
            {{- include "storscale.ca.env" . | nindent 12 }}
          ports:
            - {name: http, containerPort: 8080}
            - {name: metrics, containerPort: 9102}   # the checks', for Prometheus
          readinessProbe:
            exec: {command: ["/usr/bin/platformd", "healthcheck"]}
            periodSeconds: 5
          volumeMounts:
            - {name: catalog, mountPath: /catalog, readOnly: true}
            - {name: trino-cert, mountPath: /trino-cert, readOnly: true}   # Trino's certificate, not its key
            {{- if or .Values.brand.logo .Values.brand.icon }}
            - {name: brand, mountPath: /etc/storscale/brand, readOnly: true}
            {{- end }}
            {{- include "storscale.ca.mount" . | nindent 12 }}
          {{- include "storscale.resources" (list "20m" "32Mi" "256Mi") | nindent 10 }}
      volumes:
        {{- include "storscale.filesVolume" (list . "tools" "tools") | nindent 8 }}
        {{- include "storscale.ca.volumes" . | nindent 8 }}
        # The catalog's bot token, which catalog-sync keeps up to date.
        - {name: catalog, secret: {secretName: catalog-token, optional: true}}
        - {name: trino-cert, secret: {secretName: trino-tls, items: [{key: cert.pem, path: cert.pem}]}}
        {{- if or .Values.brand.logo .Values.brand.icon }}
        - {name: brand, configMap: {name: storscale-brand}}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: platformd
  labels: {{- include "storscale.labels" . | nindent 4 }}
spec:
  selector: {{- include "storscale.selector" (list .Release.Name "platformd") | nindent 4 }}
  ports:
    - {name: http, port: 8080, targetPort: http}
    - {name: metrics, port: 9102, targetPort: metrics}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-operator
  labels: {{- include "storscale.labels" . | nindent 4 }}
spec:
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  selector:
    matchLabels: {{- include "storscale.selector" (list .Release.Name "platform-operator") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "storscale.selector" (list .Release.Name "platform-operator") | nindent 8 }}
      annotations:
        checksum/airflow-project: {{ include "storscale.airflow.project" . | sha256sum }}
    spec:
      enableServiceLinks: false
      serviceAccountName: storscale
      initContainers:
        {{- include "storscale.wait" (list . "setup" (list "job" "setup")) | nindent 8 }}
        {{- include "storscale.wait" (list . "nessie" (list "url" "http://nessie:19120/api/v2/config")) | nindent 8 }}
      containers:
        - name: operator
          image: {{ include "storscale.image" (list . "platformd") }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["/usr/bin/platform-operator"]
          env:
            - {name: PROJECT_STORE, value: kubernetes}
            - {name: STORE_URL, value: "http://buckets:9000"}
            - {name: BUCKETS_ACCESS_KEY, valueFrom: {secretKeyRef: {name: storscale-env, key: BUCKETS_ROOT_USER}}}
            - {name: BUCKETS_SECRET_KEY, valueFrom: {secretKeyRef: {name: storscale-env, key: BUCKETS_ROOT_PASSWORD}}}
            - {name: KEYCLOAK_DIRECT_URL, value: "http://keycloak:8080/sso"}
            - {name: OPERATOR_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: storscale-env, key: OPERATOR_CLIENT_SECRET}}}
            - {name: RANGER_URL, value: "http://ranger-admin:6080"}
            - {name: RANGER_PASSWORD, valueFrom: {secretKeyRef: {name: storscale-env, key: RANGER_PASSWORD}}}
            - {name: NESSIE_URL, value: "http://nessie:19120"}
            # Projects' pipelines repos: their git connections, through the platform's Airflow account.
            - {name: AIRFLOW_URL, value: "http://airflow:8090/pipelines"}
            - {name: AIRFLOW_PASSWORD, valueFrom: {secretKeyRef: {name: storscale-env, key: AIRFLOW_PLATFORM_PASSWORD}}}
            - {name: PIPELINES_DEFAULT_REF, value: {{ .Values.pipelines.defaultRef | quote }}}
            {{- if .Values.pipelines.gitKnownHosts }}
            - {name: GIT_KNOWN_HOSTS, value: /etc/storscale/git/known_hosts}
            {{- end }}
            # Each project with a repo gets an Airflow of its own (templates/airflow-project.yaml),
            # with a database on Airflow's server, made as its admin.
            - {name: AIRFLOW_PROJECT_TEMPLATE, value: /etc/storscale/airflow-project/template.json}
            - {name: AIRFLOW_DB_HOST, value: "airflow-db:5432"}
            - {name: POSTGRES_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: storscale-env, key: POSTGRES_ADMIN_PASSWORD}}}
            - {name: PIPELINES_DEFAULT_MEMORY, value: {{ .Values.pipelines.memory | quote }}}
            - {name: PLATFORM_URL, value: {{ include "storscale.url" . | quote }}}
            # Projects' limits: Trino's resource groups (its limits' database), and buckets' sizes.
            - {name: TRINO_DB_PASSWORD, valueFrom: {secretKeyRef: {name: storscale-env, key: TRINO_DB_PASSWORD}}}
            {{- with .Values.limits }}
            - {name: LIMITS_PROJECT_QUERIES, value: {{ .project.queries | quote }}}
            - {name: LIMITS_PROJECT_QUEUED, value: {{ .project.queued | quote }}}
            - {name: LIMITS_PROJECT_QUERY_MEMORY, value: {{ .project.queryMemory | quote }}}
            - {name: LIMITS_PROJECT_STORAGE, value: {{ .project.storage | quote }}}
            - {name: LIMITS_PERSON_QUERIES, value: {{ .person.queries | quote }}}
            - {name: LIMITS_PERSON_QUEUED, value: {{ .person.queued | quote }}}
            - {name: LIMITS_TOTAL_QUERIES, value: {{ .total.queries | quote }}}
            - {name: LIMITS_TOTAL_QUEUED, value: {{ .total.queued | quote }}}
            {{- end }}
          volumeMounts:
            - {name: airflow-project, mountPath: /etc/storscale/airflow-project, readOnly: true}
          ports:
            - {name: health, containerPort: 8081}
          readinessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 5
          {{- include "storscale.resources" (list "20m" "32Mi" "256Mi") | nindent 10 }}
      volumes:
        {{- include "storscale.filesVolume" (list . "tools" "tools") | nindent 8 }}
        - {name: airflow-project, configMap: {name: storscale-airflow-project}}
---
apiVersion: v1
kind: Service
metadata:
  name: platform-operator
  labels: {{- include "storscale.labels" . | nindent 4 }}
spec:
  selector: {{- include "storscale.selector" (list .Release.Name "platform-operator") | nindent 4 }}
  ports:
    - {name: health, port: 8081, targetPort: health}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: semanticd
  labels: {{- include "storscale.labels" . | nindent 4 }}
spec:
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  selector:
    matchLabels: {{- include "storscale.selector" (list .Release.Name "semanticd") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "storscale.selector" (list .Release.Name "semanticd") | nindent 8 }}
    spec:
      enableServiceLinks: false
      serviceAccountName: storscale
      initContainers:
        {{- include "storscale.ca.init" . | nindent 8 }}
        {{- include "storscale.wait" (list . "keycloak" (list "url" "http://keycloak:9000/health/ready")) | nindent 8 }}
      containers:
        - name: semanticd
          image: {{ include "storscale.image" (list . "semanticd") }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - {name: KEYCLOAK_URL, value: "{{ include "storscale.url" . }}/sso"}
            - {name: KEYCLOAK_DIRECT_URL, value: "http://keycloak:8080/sso"}
            - {name: MCP_URL, value: "{{ include "storscale.url" . }}/mcp"}
            - {name: STORE_ACCESS_KEY, valueFrom: {secretKeyRef: {name: storscale-env, key: PLATFORM_STORE_ACCESS_KEY}}}
            - {name: STORE_SECRET_KEY, valueFrom: {secretKeyRef: {name: storscale-env, key: PLATFORM_STORE_SECRET_KEY}}}
            {{- include "storscale.ca.env" . | nindent 12 }}
          ports:
            - {name: http, containerPort: 8000}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          volumeMounts:
            - {name: tls, mountPath: /tls}
            {{- include "storscale.ca.mount" . | nindent 12 }}
          {{- include "storscale.resources" (list "20m" "160Mi" "512Mi") | nindent 10 }}
      volumes:
        {{- include "storscale.filesVolume" (list . "tools" "tools") | nindent 8 }}
        - {name: tls, secret: {secretName: trino-tls}}
        {{- include "storscale.ca.volumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: semanticd
  labels: {{- include "storscale.labels" . | nindent 4 }}
spec:
  selector: {{- include "storscale.selector" (list .Release.Name "semanticd") | nindent 4 }}
  ports:
    - {name: http, port: 8000, targetPort: http}
