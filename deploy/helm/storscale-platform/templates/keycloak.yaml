# Keycloak: sign-in for everything. In production mode, on its own database
# (keycloak, on the platform's Postgres). The realm (stack/keycloak/realm.json),
# with the signing key the chart keeps, is imported only when there's none
# yet; after that the realm is kept, and setup (setup/realm.py) keeps the
# platform's own parts of it up to date: people and their sign-in are the
# organisation's.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels: {{- include "storscale.labels" . | nindent 4 }}
spec:
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  selector:
    matchLabels: {{- include "storscale.selector" (list .Release.Name "keycloak") | nindent 6 }}
  strategy: {type: Recreate}
  template:
    metadata:
      labels: {{- include "storscale.selector" (list .Release.Name "keycloak") | nindent 8 }}
    spec:
      enableServiceLinks: false
      initContainers:
        # Its database and user, if they're missing (an install from 0.5.0 or
        # before, whose Postgres was made without them): as Postgres' admin,
        # who is in this step alone.
        - name: database
          image: {{ .Values.upstream.postgres }}
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}   # the Postgres client alone: its image's postgres user
          command: ["bash", "-c"]
          args:
            - |
              until pg_isready -h keycloak-db -U postgres -q; do sleep 2; done
              psql -h keycloak-db -U postgres -v ON_ERROR_STOP=1 -v pw="$KEYCLOAK_DB_PASSWORD" <<'SQL'
              SELECT 'CREATE ROLE keycloak LOGIN' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'keycloak') \gexec
              ALTER ROLE keycloak PASSWORD :'pw';
              SELECT 'CREATE DATABASE keycloak OWNER keycloak' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'keycloak') \gexec
              REVOKE CONNECT, TEMPORARY ON DATABASE keycloak FROM PUBLIC;
              SQL
          env:
            - {name: PGPASSWORD, valueFrom: {secretKeyRef: {name: storscale-env, key: POSTGRES_ADMIN_PASSWORD}}}
            - {name: KEYCLOAK_DB_PASSWORD, valueFrom: {secretKeyRef: {name: storscale-env, key: KEYCLOAK_DB_PASSWORD}}}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
      containers:
        - name: keycloak
          image: {{ .Values.upstream.keycloak }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          command: ["bash", "-c"]
          args:
            - |
              export KC_SIGNING_KEY="$(grep -v -- ----- /keys/key.pem | tr -d '\n')"
              export KC_SIGNING_CERT="$(grep -v -- ----- /keys/cert.pem | tr -d '\n')"
              exec /opt/keycloak/bin/kc.sh start --import-realm
          {{- include "storscale.envFrom" . | nindent 10 }}
          env:
            - {name: JAVA_OPTS_KC_HEAP, value: "-Xms128m -Xmx384m"}
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin}
            - {name: KC_BOOTSTRAP_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: storscale-env, key: KEYCLOAK_ADMIN_PASSWORD}}}
            - {name: KC_HOSTNAME, value: "{{ include "storscale.url" . }}/sso"}
            - {name: KC_HTTP_RELATIVE_PATH, value: /sso}
            - {name: KC_HTTP_MANAGEMENT_RELATIVE_PATH, value: /}
            - {name: KC_PROXY_HEADERS, value: xforwarded}
            - {name: KC_HEALTH_ENABLED, value: "true"}
            - {name: KC_HTTP_ENABLED, value: "true"}   # plain HTTP behind the gateway
            - {name: KC_CACHE, value: local}           # one Keycloak
            - {name: KC_DB, value: postgres}
            - {name: KC_DB_URL, value: "jdbc:postgresql://keycloak-db:5432/keycloak"}
            - {name: KC_DB_USERNAME, value: keycloak}
            - {name: KC_DB_PASSWORD, valueFrom: {secretKeyRef: {name: storscale-env, key: KEYCLOAK_DB_PASSWORD}}}
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 9000}
          readinessProbe:
            httpGet: {path: /health/ready, port: management}
            periodSeconds: 5
            failureThreshold: 60
          volumeMounts:
            - {name: realm, mountPath: /opt/keycloak/data/import/lakehouse-realm.json, subPath: realm.json}
            - {name: keys, mountPath: /keys}
          {{- include "storscale.resources" (list "100m" "512Mi" "768Mi") | nindent 10 }}
      volumes:
        - {name: realm, configMap: {name: files-keycloak}}
        - {name: keys, secret: {secretName: keycloak-keys}}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels: {{- include "storscale.labels" . | nindent 4 }}
spec:
  selector: {{- include "storscale.selector" (list .Release.Name "keycloak") | nindent 4 }}
  ports:
    - {name: http, port: 8080, targetPort: http}
    - {name: management, port: 9000, targetPort: management}
