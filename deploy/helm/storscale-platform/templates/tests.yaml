{{/* The end-to-end checks, as Compose's test and test-browser: `helm test`
     (or `storscale test --k8s [suite ...]`, which writes the ConfigMap
     storscale-tests first to pick suites). */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: storscale-test
  labels: {{- include "storscale.labels" . | nindent 4 }}
---
# The monitoring suite fails one of Buckets' drives for a minute, as a failing
# disk would: from a pod of its own, with the drive's volume mounted.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: storscale-test
  labels: {{- include "storscale.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [configmaps, secrets]
    verbs: [get]
  # The pipelines_git suite's own Secret, its git host's token: that one only
  # (create can't be limited to a name; it's made under this one).
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [storscale-test-git, storscale-alerts, storscale-test-alerts, storscale-test-source, storscale-test-copy]   # the health suites put back what was there
    verbs: [update, delete]
  # ... and the project Airflow the operator makes for it (its memory).
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: storscale-test
  labels: {{- include "storscale.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: storscale-test}
subjects:
  - {kind: ServiceAccount, name: storscale-test, namespace: {{ .Release.Namespace }}}
---
apiVersion: v1
kind: Pod
metadata:
  name: storscale-test
  labels:
    {{- include "storscale.labels" . | nindent 4 }}
    app.kubernetes.io/name: storscale-test   # for the network policies
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "2"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  enableServiceLinks: false
  serviceAccountName: storscale-test
  restartPolicy: Never
  {{- with include "storscale.ca.init" . }}
  initContainers: {{- . | nindent 4 }}
  {{- end }}
  containers:
    - name: test
      image: {{ include "storscale.image" (list . "tools") }}
      securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
      imagePullPolicy: {{ .Values.images.pullPolicy }}
      # The suites picked (all of them when none are), less the browser's.
      command: ["sh", "-c"]
      args:
        - |
          f=/etc/storscale-tests/suites
          if [ -f $f ]; then picked=$(tr ' ' '\n' < $f | grep -vx shell | tr '\n' ' '); [ -n "${picked# }" ] || exit 0; fi
          exec python -u /tests/run.py $picked
      {{- include "storscale.envFrom" . | nindent 6 }}
      env:
        - {name: BUCKETS_DRIVE, value: "buckets-pool-0-0/data2-buckets-pool-0-0"}
        - {name: STORSCALE_TOOLS_IMAGE, value: {{ include "storscale.image" (list . "tools") | quote }}}
        {{- include "storscale.ca.env" . | nindent 8 }}
      volumeMounts:
        - {name: files-tools, mountPath: /tools}
        - {name: files-tests, mountPath: /tests}
        - {name: files-projects, mountPath: /projects}
        - {name: files-keycloak, mountPath: /keycloak}
        - {name: files-monitoring, mountPath: /dashboards, subPath: dashboards}
        - {name: tls, mountPath: /tls}
        - {name: suites, mountPath: /etc/storscale-tests}
        {{- include "storscale.ca.mount" . | nindent 8 }}
      {{- include "storscale.resources" (list "50m" "128Mi" "768Mi") | nindent 6 }}
  volumes:
    {{- include "storscale.filesVolume" (list . "tools" "tools") | nindent 4 }}
    {{- include "storscale.filesVolume" (list . "tests" "tests") | nindent 4 }}
    {{- include "storscale.filesVolume" (list . "projects" "projects") | nindent 4 }}
    {{- include "storscale.filesVolume" (list . "keycloak" "keycloak") | nindent 4 }}
    {{- include "storscale.filesVolume" (list . "monitoring" "monitoring") | nindent 4 }}
    - {name: tls, secret: {secretName: trino-tls}}
    - {name: suites, configMap: {name: storscale-tests, optional: true}}
    {{- include "storscale.ca.volumes" . | nindent 4 }}
---
apiVersion: v1
kind: Pod
metadata:
  name: storscale-test-browser
  labels:
    {{- include "storscale.labels" . | nindent 4 }}
    app.kubernetes.io/name: storscale-test-browser   # for the network policies
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  enableServiceLinks: false
  restartPolicy: Never
  containers:
    - name: browser
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble
      securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}   # pwuser
      command: ["sh", "-c"]
      args:
        - |
          f=/etc/storscale-tests/suites
          if [ -f $f ] && ! grep -qw shell $f; then exit 0; fi
          pip install -q --user playwright==1.63.0 && exec python -u /tests/shell.py
      {{- include "storscale.envFrom" . | nindent 6 }}
      env:
        - {name: SHELL_SWITCH, value: "0"}
      volumeMounts:
        - {name: files-tests, mountPath: /tests}
        - {name: shm, mountPath: /dev/shm}
        - {name: suites, mountPath: /etc/storscale-tests}
      resources:
        requests: {cpu: 100m, memory: 512Mi}
  volumes:
    {{- include "storscale.filesVolume" (list . "tests" "tests") | nindent 4 }}
    - {name: shm, emptyDir: {medium: Memory, sizeLimit: 1Gi}}
    - {name: suites, configMap: {name: storscale-tests, optional: true}}
