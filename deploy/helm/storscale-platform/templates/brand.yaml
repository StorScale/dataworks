{{/* The deployment's own logo (brand.logo), for platformd (brand.go). */}}
{{- if .Values.brand.logo }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: storscale-brand
  labels: {{- include "storscale.labels" . | nindent 4 }}
binaryData:
  logo: {{ .Values.brand.logo | nospace | quote }}
{{- end }}
