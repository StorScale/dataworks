# Buckets: the platform's S3 storage, run by the Buckets operator. Its
# Service is "buckets" on port 9000, as in Compose. People sign in with
# Keycloak, and each of their groups names a Buckets policy.
apiVersion: buckets.io/v1alpha1
kind: BucketsCluster
metadata:
  name: buckets
  labels: {{- include "storscale.labels" . | nindent 4 }}
spec:
  image: {{ .Values.upstream.bucketsd }}
  credsSecret: {name: buckets-root}
  pools:
    - servers: {{ .Values.buckets.servers }}
      volumesPerServer: {{ .Values.buckets.volumesPerServer }}
      volumeClaimTemplate:
        {{- with .Values.buckets.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests: {storage: {{ .Values.buckets.storage }}}
      resources:
        requests: {cpu: 100m, memory: 256Mi}
  env:
    - {name: MINIO_IDENTITY_OPENID_CONFIG_URL, value: "{{ include "storscale.url" . }}/sso/realms/lakehouse/.well-known/openid-configuration"}
    - {name: MINIO_IDENTITY_OPENID_CLIENT_ID, value: lakehouse}
    - {name: MINIO_IDENTITY_OPENID_CLAIM_NAME, value: groups}
    - {name: BUCKETS_AUDIT_LOCAL_MAX, value: {{ .Values.buckets.auditLocalMax | quote }}}
  {{- if include "storscale.ca.enabled" . }}
    # It reads Keycloak's configuration at the public address. The operator
    # makes its pods, so no ca-bundle init container: bucketsd (OpenSSL)
    # trusts the CAs in SSL_CERT_FILE in place of the image's own list, which
    # the platform's Buckets doesn't need (it calls only the platform).
    - {name: SSL_CERT_FILE, value: /etc/storscale/ca/ca.crt}
  volumes:
    - name: storscale-ca
      configMap:
        name: {{ include "storscale.ca.configMap" . }}
        items: [{key: {{ .Values.global.ca.key | quote }}, path: ca.crt}]
  volumeMounts:
    - {name: storscale-ca, mountPath: /etc/storscale/ca, readOnly: true}
  {{- end }}
