{{/* MLflow (use case 15.1): one tracking server and model registry for the
     install, a workspace per project. Only platformd reaches it (its network
     policy): platformd signs people in, checks they're in the project, and
     names the project's workspace on each request. Its runs and models in
     the platform's Postgres (database mlflow); its artifacts in the bucket
     mlflow, which it proxies, so no client holds Buckets' keys. */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  labels: {{- include "storscale.labels" . | nindent 4 }}
spec:
  replicas: 1
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  selector:
    matchLabels: {{- include "storscale.selector" (list .Release.Name "mlflow") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "storscale.selector" (list .Release.Name "mlflow") | nindent 8 }}
    spec:
      enableServiceLinks: false
      serviceAccountName: storscale
      initContainers:
        {{- include "storscale.wait" (list . "setup" (list "job" "setup")) | nindent 8 }}
        # Its database and account on the platform's Postgres, made if missing, as the other tools' are.
        - name: database
          image: {{ .Values.upstream.postgres }}
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          command: ["bash", "-c"]
          args:
            - |
              until pg_isready -h mlflow-db -U postgres -q; do sleep 2; done
              psql -h mlflow-db -U postgres -v ON_ERROR_STOP=1 -v pw="$MLFLOW_DB_PASSWORD" <<'SQL'
              SELECT 'CREATE ROLE mlflow LOGIN' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'mlflow') \gexec
              ALTER ROLE mlflow PASSWORD :'pw';
              SELECT 'CREATE DATABASE mlflow OWNER mlflow' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'mlflow') \gexec
              REVOKE CONNECT, TEMPORARY ON DATABASE mlflow FROM PUBLIC;
              SQL
          env:
            - {name: PGPASSWORD, valueFrom: {secretKeyRef: {name: storscale-env, key: POSTGRES_ADMIN_PASSWORD}}}
            - {name: MLFLOW_DB_PASSWORD, valueFrom: {secretKeyRef: {name: storscale-env, key: MLFLOW_DB_PASSWORD}}}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
      containers:
        - name: mlflow
          image: {{ include "storscale.image" (list . "mlflow") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          env:
            - {name: MLFLOW_DB_PASSWORD, valueFrom: {secretKeyRef: {name: storscale-env, key: MLFLOW_DB_PASSWORD}}}
            - {name: MLFLOW_ENABLE_WORKSPACES, value: "true"}
            - {name: MLFLOW_SERVER_ALLOWED_HOSTS, value: "mlflow:5000,mlflow,localhost:5000"}
            - {name: MLFLOW_S3_ENDPOINT_URL, value: "http://buckets:9000"}
            - {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: storscale-env, key: MLFLOW_S3_ACCESS_KEY}}}
            - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: storscale-env, key: MLFLOW_S3_SECRET_KEY}}}
            - {name: AWS_DEFAULT_REGION, value: us-east-1}
          ports:
            - {name: http, containerPort: 5000}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          {{- include "storscale.resources" (list "50m" "384Mi" "1Gi") | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  labels: {{- include "storscale.labels" . | nindent 4 }}
spec:
  selector: {{- include "storscale.selector" (list .Release.Name "mlflow") | nindent 4 }}
  ports:
    - {name: http, port: 5000, targetPort: http}
