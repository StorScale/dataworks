{{- if include "storscale.store.external" . }}
{{- $store := urlParse .Values.storage.external.endpoint }}
# The platform's files on an external S3 store (storage.external): the
# Service buckets, on port 9000 as the platform's own Buckets is, forwarding
# to the store's endpoint (platformd store-forward, cmd/platformd/storeforward.go).
# Every service keeps its one address for the store; the forwarder passes each
# request on as it came, Host included, so the signatures made for buckets:9000
# (and for s3.<domain> through the gateway) hold at the store. It adds one
# thing: a multi-object delete without a Content-MD5 gets its body's, which a
# MinIO from before 2025 asks for and newer AWS SDKs no longer send. It trusts
# the store's certificate through global.ca.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-forwarder
  labels: {{- include "storscale.labels" . | nindent 4 }}
spec:
  replicas: {{ include "storscale.replicas" (list . "store-forwarder") }}
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  selector:
    matchLabels: {{- include "storscale.selector" (list .Release.Name "store-forwarder") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "storscale.selector" (list .Release.Name "store-forwarder") | nindent 8 }}
      annotations:
        checksum/config: {{ printf "%s|%s" .Values.storage.external.endpoint (include "storscale.ca.configMap" .) | sha256sum }}
    spec:
      {{- include "storscale.spread" (list . "store-forwarder") | nindent 6 }}
      enableServiceLinks: false
      {{- with include "storscale.ca.init" . }}
      initContainers:
        {{- . | nindent 8 }}
      {{- end }}
      containers:
        - name: forwarder
          image: {{ include "storscale.image" (list . "platformd") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          args: ["store-forward"]
          env:
            - {name: STORE_ENDPOINT, value: {{ .Values.storage.external.endpoint | quote }}}
            {{- include "storscale.ca.env" . | nindent 12 }}
          ports:
            - {name: s3, containerPort: 9000}
          readinessProbe:
            httpGet: {path: /minio/health/live, port: s3}   # the store, through it
            periodSeconds: 10
            failureThreshold: 6
          {{- with include "storscale.ca.mount" . }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
          {{- include "storscale.resources" (list "50m" "64Mi" "512Mi") | nindent 10 }}
      {{- with include "storscale.ca.volumes" . }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: buckets
  labels: {{- include "storscale.labels" . | nindent 4 }}
spec:
  selector: {{- include "storscale.selector" (list .Release.Name "store-forwarder") | nindent 4 }}
  ports:
    - {name: s3, port: 9000, targetPort: s3}
{{- end }}
