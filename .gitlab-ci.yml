# The images and the chart for an internal registry (Harbor), built on a
# GitLab runner of the company's own. GitHub's workflows (.github/) stay the
# public build: ghcr.io/storscale, multi-arch, signed. This one builds the same
# ten images for linux/amd64 only, with BuildKit (the JupyterHub image's
# Dockerfile needs it), and pushes them to
#
#   $HARBOR_REGISTRY/$HARBOR_PROJECT/platformd, .../platform-<name>
#   oci://$HARBOR_REGISTRY/$HARBOR_PROJECT/charts/storscale-platform   (tags v*)
#
# Tags pushed, as GitHub's: pushes to the default branch <short sha (8)> and
# the branch's name; tags v<version> <version> and latest. Another branch
# builds every image without pushing, to check it.
#
# The project's (or its groups') CI/CD variables (Settings > CI/CD > Variables):
#   HARBOR_REGISTRY   the registry's host (harbor.example.internal)
#   HARBOR_PROJECT    its project for these images and the chart, and a folder in
#                     it if wanted (vericast/dataworks: .../vericast/dataworks/platformd)
#   HARBOR_USER       a robot account of that project, allowed to push
#   HARBOR_PASSWORD   its secret (masked)
#   HARBOR_CA         a File variable: the CA that signed the registry's
#                     certificate (PEM), when it isn't a public one
# The chart packaged here names the Harbor project as its images' registry
# (images.registry), so an install from it pulls from Harbor.

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
    - if: $CI_COMMIT_BRANCH

default:
  tags: [sa1x-k8s-dev-1a]

stages: [images, chart]

build:
  stage: images
  image:
    name: moby/buildkit:v0.23.2-rootless
    entrypoint: [""]
  timeout: 90m
  # Harbor now and then drops a push (a TLS handshake timeout, "blob upload
  # unknown to registry"): the job is run again, up to twice.
  retry:
    max: 2
    when: [script_failure, runner_system_failure]
  variables:
    # A pod can't give rootless BuildKit a process sandbox of its own.
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox --config /home/user/.config/buildkit/buildkitd.toml
  parallel:
    matrix:
      - {NAME: platformd, CONTEXT: ., DOCKERFILE: docker/platformd.Dockerfile}
      - {NAME: platform-tools, CONTEXT: stack/tools}
      - {NAME: platform-airflow, CONTEXT: stack/airflow/image}
      - {NAME: platform-superset, CONTEXT: stack/superset/image}
      - {NAME: platform-jupyterhub, CONTEXT: stack/jupyterhub/image, TARGET: hub}
      - {NAME: platform-notebook, CONTEXT: stack/jupyterhub/image, TARGET: notebook}
      - {NAME: platform-opensearch, CONTEXT: stack/catalog/opensearch}
      - {NAME: platform-semanticd, CONTEXT: stack/semantic}
      - {NAME: platform-catalog-sync, CONTEXT: stack/catalog/sync}
      - {NAME: platform-mlflow, CONTEXT: stack/mlflow}
  script:
    - |
      set -eu
      : "${HARBOR_REGISTRY:?set the project's CI/CD variable HARBOR_REGISTRY}" "${HARBOR_PROJECT:?set HARBOR_PROJECT}"
      image="$HARBOR_REGISTRY/$HARBOR_PROJECT/$NAME"
      push=false
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        names="$image:${CI_COMMIT_TAG#v},$image:latest"; push=true
      else
        names="$image:$CI_COMMIT_SHORT_SHA,$image:$(echo "$CI_COMMIT_REF_NAME" | tr / -)"
        [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] && push=true
      fi
      mkdir -p ~/.docker ~/.config/buildkit
      : > ~/.config/buildkit/buildkitd.toml
      if [ -n "${HARBOR_CA:-}" ]; then
        # The daemon pushes with the registry's CA; buildctl, which fetches the
        # registry's token, trusts the system's CAs and that one together.
        printf '[registry."%s"]\n  ca = ["%s"]\n' "$HARBOR_REGISTRY" "$HARBOR_CA" > ~/.config/buildkit/buildkitd.toml
        cat "$(ls /etc/ssl/certs/ca-certificates.crt /etc/ssl/cert.pem 2>/dev/null | head -1)" "$HARBOR_CA" > ~/ca-bundle.pem
        export SSL_CERT_FILE=~/ca-bundle.pem
      fi
      if [ "$push" = true ]; then
        : "${HARBOR_USER:?set HARBOR_USER}" "${HARBOR_PASSWORD:?set HARBOR_PASSWORD}"
        auth=$(printf '%s:%s' "$HARBOR_USER" "$HARBOR_PASSWORD" | base64 | tr -d '\n')
        printf '{"auths":{"%s":{"auth":"%s"}}}' "$HARBOR_REGISTRY" "$auth" > ~/.docker/config.json
      fi
      dockerfile=${DOCKERFILE:-$CONTEXT/Dockerfile}
      set -- --opt filename="$(basename "$dockerfile")"
      [ -n "${TARGET:-}" ] && set -- "$@" --opt target="$TARGET"
      echo "building $NAME ($names), push=$push"
      buildctl-daemonless.sh build --frontend dockerfile.v0 \
        --local context="$CONTEXT" --local dockerfile="$(dirname "$dockerfile")" "$@" \
        --opt platform=linux/amd64 \
        --opt label:org.opencontainers.image.source="$CI_PROJECT_URL" \
        --opt label:org.opencontainers.image.revision="$CI_COMMIT_SHA" \
        --opt label:org.opencontainers.image.licenses=AGPL-3.0-or-later \
        --output "type=image,\"name=$names\",push=$push"

# The chart, at the release's version, its images Harbor's.
chart:
  stage: chart
  image:
    name: alpine/helm:3.18.6
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  script:
    - |
      set -eu
      version=${CI_COMMIT_TAG#v}
      set --
      [ -n "${HARBOR_CA:-}" ] && set -- --ca-file "$HARBOR_CA"
      sed -i "s#^  registry: ghcr.io/storscale\$#  registry: $HARBOR_REGISTRY/$HARBOR_PROJECT#" deploy/helm/storscale-platform/values.yaml
      grep -q "^  registry: $HARBOR_REGISTRY/$HARBOR_PROJECT\$" deploy/helm/storscale-platform/values.yaml
      printf '%s' "$HARBOR_PASSWORD" | helm registry login "$HARBOR_REGISTRY" -u "$HARBOR_USER" --password-stdin "$@"
      helm repo add spark-operator https://kubeflow.github.io/spark-operator
      helm dependency build deploy/helm/storscale-platform
      helm package deploy/helm/storscale-platform --version "$version" --app-version "$version"
      helm push "storscale-platform-$version.tgz" "oci://$HARBOR_REGISTRY/$HARBOR_PROJECT/charts" "$@"
