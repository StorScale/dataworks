# The platform's images, pushed to ghcr.io/storscale, and on releases its Helm
# chart (oci://ghcr.io/storscale/charts/storscale-platform):
#
#   ghcr.io/storscale/platformd           platformd and the platform's web app
#   ghcr.io/storscale/platform-<name>     the chart's images of stack/'s services: tools,
#                                         airflow, superset, jupyterhub, notebook, opensearch,
#                                         semanticd, catalog-sync, mlflow
#
# Tags pushed:
#   - pushes to main:   <short sha (8)> and main
#   - tags v<version>:  <version> and latest; also signed with cosign (keyless:
#                       this workflow's GitHub identity)
# Every image is multi-arch (linux/amd64 and linux/arm64, each built natively)
# and carries an SBOM and build provenance as attestations.
#
# Verify a release image:
#   cosign verify ghcr.io/storscale/platformd:<version> \
#     --certificate-identity-regexp '^https://github.com/StorScale/storscale-platform/\.github/workflows/images\.yml@refs/tags/v' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io/storscale

jobs:
  # Each image is built natively on an amd64 and an arm64 runner and pushed by
  # digest; "merge" then joins the two under the tags as one multi-arch image.
  image:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write   # push to ghcr.io
    strategy:
      fail-fast: false
      matrix:
        name: [platformd, platform-tools, platform-airflow, platform-superset, platform-jupyterhub,
               platform-notebook, platform-opensearch, platform-semanticd, platform-catalog-sync, platform-mlflow]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
          # The Helm chart's images (deploy/helm/storscale-platform, images.*).
          - {name: platformd, context: ., dockerfile: docker/platformd.Dockerfile}
          - {name: platform-tools, context: stack/tools}
          - {name: platform-airflow, context: stack/airflow/image}
          - {name: platform-superset, context: stack/superset/image}
          - {name: platform-jupyterhub, context: stack/jupyterhub/image, target: hub}
          - {name: platform-notebook, context: stack/jupyterhub/image, target: notebook}
          - {name: platform-opensearch, context: stack/catalog/opensearch}
          - {name: platform-semanticd, context: stack/semantic}
          - {name: platform-catalog-sync, context: stack/catalog/sync}
          - {name: platform-mlflow, context: stack/mlflow}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile || format('{0}/Dockerfile', matrix.context) }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.name }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }},mode=max

      - name: Record the digest
        run: |
          mkdir -p digests
          echo "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.name }}-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  merge:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io
      id-token: write   # cosign keyless signing
    strategy:
      fail-fast: false
      matrix:
        name: [platformd, platform-tools, platform-airflow, platform-superset, platform-jupyterhub,
               platform-notebook, platform-opensearch, platform-semanticd, platform-catalog-sync, platform-mlflow]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.name }}-*
          merge-multiple: true
          path: digests

      - name: Tags
        id: tags
        run: |
          image="$REGISTRY/${{ matrix.name }}"
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            version=${GITHUB_REF_NAME#v}
            echo "list=$image:$version $image:latest" >> "$GITHUB_OUTPUT"
          else
            echo "list=$image:${GITHUB_SHA::8} $image:${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join the architectures under the tags
        id: merge
        run: |
          image=${{ steps.tags.outputs.image }}
          tags=(); for t in ${{ steps.tags.outputs.list }}; do tags+=(-t "$t"); done
          docker buildx imagetools create "${tags[@]}" "$image@$(cat digests/amd64)" "$image@$(cat digests/arm64)"
          first="${{ steps.tags.outputs.list }}"; first=${first%% *}
          docker buildx imagetools inspect "$first"
          echo "digest=$(docker buildx imagetools inspect "$first" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v3
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Sign
        if: startsWith(github.ref, 'refs/tags/v')
        run: cosign sign --yes "${{ steps.tags.outputs.image }}@${{ steps.merge.outputs.digest }}"

  # Each image scanned for known vulnerabilities (Trivy): all of them to the
  # repository's Security tab, the high and critical ones with a fix in the
  # run's summary. A report, not a gate: most come from the upstream bases.
  scan:
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # the Security tab
    strategy:
      fail-fast: false
      matrix:
        name: [platformd, platform-tools, platform-airflow, platform-superset, platform-jupyterhub,
               platform-notebook, platform-opensearch, platform-semanticd, platform-catalog-sync, platform-mlflow]
    steps:
      - name: Scan
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then tag=${GITHUB_REF_NAME#v}; else tag=${GITHUB_SHA::8}; fi
          image="$REGISTRY/${{ matrix.name }}:$tag"
          trivy() { docker run --rm -v "$PWD:/out" -v trivy-cache:/root/.cache aquasec/trivy:0.65.0 "$@"; }
          trivy image --quiet --scanners vuln --format sarif --output /out/trivy.sarif "$image"
          {
            echo "### ${{ matrix.name }}: high and critical vulnerabilities with a fix"
            echo '```'
            trivy image --quiet --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --format table "$image"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: ${{ matrix.name }}

  # The chart, at the release's version: its images are that version's.
  chart:
    needs: merge
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Package and push the chart
        run: |
          version=${GITHUB_REF_NAME#v}
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm repo add spark-operator https://kubeflow.github.io/spark-operator
          helm dependency build deploy/helm/storscale-platform
          helm package deploy/helm/storscale-platform --version "$version" --app-version "$version"
          helm push "storscale-platform-$version.tgz" oci://ghcr.io/storscale/charts
