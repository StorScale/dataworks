name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: The web app
        working-directory: web
        run: npm ci --no-fund --no-audit && npm run build
      - name: The stack's Compose file
        run: docker compose --project-directory stack config --quiet

  # The whole platform, as `storscale up` starts it, and every suite of checks.
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Room for the images
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - run: go build -o bin/storscale ./cmd/storscale
      # --dir stack: this checkout's stack, building the platform's own images from source
      - run: bin/storscale up --dir stack
      - run: bin/storscale test --dir stack
        env:
          SHELL_SWITCH: "1"   # the runner has the memory to switch between tools in one page
      - name: What went wrong
        if: failure()
        run: |
          bin/storscale status --dir stack
          docker compose --project-name storscale logs --no-color --tail 200

  # The platform on Kubernetes: the Helm chart on kind, as `storscale up --k8s`
  # installs it, and every suite of checks (helm test).
  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # a first install pulls ~10 GB of images, then waits on each setup step
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with:
          install_only: true   # storscale makes the cluster (deploy/kind/cluster.yaml)
      - name: Room for the images
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - run: go build -o bin/storscale ./cmd/storscale
      # --dir stack: this checkout's images and chart
      - run: bin/storscale up --dir stack --k8s
      - run: bin/storscale test --dir stack --k8s
      - name: What went wrong
        if: failure()
        run: |
          kubectl --context kind-storscale -n storscale get pods,jobs,projects -o wide
          kubectl --context kind-storscale -n storscale get events --sort-by=.lastTimestamp | tail -40
          kubectl --context kind-storscale -n storscale describe jobs | grep -E '^Name:|Pods Statuses|^Events|  (Normal|Warning)' || true
          for p in $(kubectl --context kind-storscale -n storscale get pods -o name); do
            echo "=== $p"; kubectl --context kind-storscale -n storscale logs "$p" --all-containers --tail 60 || true
            # the run before a restart, for a container that crashed
            kubectl --context kind-storscale -n storscale logs "$p" --all-containers --previous --tail 40 2>/dev/null \
              | sed 's/^/  (before its restart) /' || true
          done
