name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: The web app
        working-directory: web
        run: npm ci --no-fund --no-audit && npm run build
      - name: The stack's Compose file
        run: docker compose --project-directory stack config --quiet

  # The whole platform, as `storscale up` starts it, and every suite of checks.
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Room for the images
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - run: go build -o bin/storscale ./cmd/storscale
      # --dir stack: this checkout's stack, building the platform's own images from source
      - run: bin/storscale up --dir stack
      - run: bin/storscale test --dir stack
        env:
          SHELL_SWITCH: "1"   # the runner has the memory to switch between tools in one page
      - name: What went wrong
        if: failure()
        run: |
          bin/storscale status --dir stack
          docker compose --project-name storscale logs --no-color --tail 200

  # The platform on Kubernetes, upgraded: the last release installed on kind
  # (`storscale up --k8s --version`), a project kept in it, then `storscale
  # upgrade` to this checkout, as a real cluster would be; the project must
  # keep every setting. Then every suite of checks (helm test). (A fresh
  # install is kubernetes-https's.)
  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # a first install pulls ~10 GB of images, then waits on each setup step; then the upgrade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with:
          install_only: true   # storscale makes the cluster (deploy/kind/cluster.yaml)
      - name: Room for the images
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - run: go build -o bin/storscale ./cmd/storscale
      - name: The last release
        id: last
        run: |
          # The newest release that isn't this commit (a release's own tag is).
          git fetch --tags --quiet
          v=$(git tag --list 'v*' --sort=-v:refname | grep -vxF -f <(git tag --points-at HEAD; echo none) | head -1)
          echo "the last release: $v"
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"
      - run: bin/storscale up --k8s --version ${{ steps.last.outputs.version }}
      # Only fields the last release knows (limits came in 0.6.0).
      - name: A project, as the last release keeps it
        run: |
          kubectl --context kind-storscale -n storscale apply -f - <<'YAML'
          apiVersion: platform.storscale.io/v1alpha1
          kind: Project
          metadata: {name: upgrade-check}
          spec:
            description: Kept through an upgrade.
            members: [{group: engineers, role: editor}, {group: analysts, role: reader}]
            tables: {namespace: upgrade_check, readers: {tables: [kept]}}
            files: {}
            limits: {queries: 3, storage: 5Gi}
          YAML
      - run: bin/storscale upgrade --k8s --dir stack --yes
      - name: The project kept every setting
        run: |
          p() { kubectl --context kind-storscale -n storscale get project upgrade-check -o jsonpath="$1"; }
          test "$(p '{.spec.description}|{.spec.tables.namespace}|{.spec.tables.readers.tables[0]}|{.spec.limits.queries}|{.spec.limits.storage}|{.spec.members[1].group}')" \
            = "Kept through an upgrade.|upgrade_check|kept|3|5Gi|analysts"
          for i in $(seq 60); do [ "$(p '{.status.phase}')" = Ready ] && break; sleep 5; done
          p '{.status.phase}' | grep -qx Ready
          kubectl --context kind-storscale -n storscale delete project upgrade-check --wait
      # Only the last release's own images: --prune would also take the ones
      # no container runs yet, such as the notebooks'.
      - name: Room again (the last release's images)
        env:
          LAST: ${{ steps.last.outputs.version }}
        run: |
          old=$(docker exec storscale-control-plane crictl images | awk -v t="$LAST" '$1 ~ /^ghcr\.io\/storscale\// && $2 == t {print $1":"$2}')
          # One at a time, with time to (crictl's own limit is 2s); best effort:
          # it only makes room.
          for i in $old; do
            docker exec storscale-control-plane crictl --timeout 120s rmi "$i" || echo "::warning::couldn't remove $i"
          done
          df -h /
      - run: bin/storscale test --dir stack --k8s
      - name: What went wrong
        if: failure()
        run: deploy/kind/diagnose.sh

  # The same on kind behind HTTPS, as on a real cluster: ingress-nginx ends
  # TLS with a certificate from a private CA that only the platform's
  # settings know of (deploy/kind/https.sh, https.yaml). Every suite but the
  # browser's, whose Chromium keeps its own trust store.
  kubernetes-https:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      STORSCALE_DOMAIN: storscale.test   # not .localhost: libcurl takes those for loopback
      STORSCALE_K8S_VALUES: deploy/kind/https.yaml deploy/kind/ha.yaml deploy/kind/copies.yaml   # HTTPS, two of the services people notice, change capture
      KUBECTL_CONTEXT: kind-storscale
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - name: Room for the images
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - run: go build -o bin/storscale ./cmd/storscale
      - run: kind create cluster --name storscale --config deploy/kind/cluster.yaml --wait 180s
      - run: deploy/kind/https.sh "$STORSCALE_DOMAIN" storscale
      # Backups on: a key pair, its certificate given to the chart.
      - name: A backup key
        run: |
          bin/storscale backup keygen --out "$RUNNER_TEMP/backup"
          python3 -c 'import json,sys; print(json.dumps({"backup": {"certificate": open(sys.argv[1]).read(), "data": {"enabled": True, "allowInternal": True}}}))' \
            "$RUNNER_TEMP/backup/storscale-backup-cert.pem" > "$RUNNER_TEMP/backup/values.json"
          echo "STORSCALE_K8S_VALUES=$STORSCALE_K8S_VALUES $RUNNER_TEMP/backup/values.json" >> "$GITHUB_ENV"
      - run: bin/storscale up --dir stack --k8s
      - run: bin/storscale test --dir stack --k8s realm health lakehouse superset airflow jupyterhub catalog semantic projects project_alerts audit maintenance history sources copies pipelines_git limits monitoring
      # One pod of each replicated service gone (as a node's would be): the
      # others go on serving, as the sign-in and lakehouse suites check.
      - name: One of each replicated service lost
        run: |
          for svc in gateway keycloak nessie; do
            pod=$(kubectl --context kind-storscale -n storscale get pod -l app.kubernetes.io/name=$svc -o jsonpath='{.items[0].metadata.name}')
            echo "deleting $pod"; kubectl --context kind-storscale -n storscale delete pod "$pod" --wait=false
          done
      - run: bin/storscale test --dir stack --k8s realm lakehouse
      # A backup, and a restore from it: something in each place it keeps,
      # backed up, removed, restored, checked.
      - run: bin/storscale test --dir stack --k8s restore_mark
      - run: bin/storscale backup --k8s
      - run: bin/storscale test --dir stack --k8s restore_damage
      - run: bin/storscale restore --k8s --key "$RUNNER_TEMP/backup/storscale-backup-key.pem" --data --yes
      - run: bin/storscale test --dir stack --k8s restore_check
      - name: What went wrong
        if: failure()
        run: deploy/kind/diagnose.sh
